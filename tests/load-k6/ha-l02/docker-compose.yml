# HA-L02 local scenario: the real claims service with its PostgreSQL behind
# Toxiproxy, the Redis of the read cache and Moto as Cognito. Toxiproxy slows
# down or cuts the database so the read cache has to answer. Run it with
# ./run.sh. Build context is the repository root. Published ports (127.0.0.1
# only): claims 8302, Toxiproxy API 8502, Moto 5130.
name: ha-l02

services:
  postgres-claims:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=claims
      - POSTGRES_USER=claims
      - POSTGRES_PASSWORD=${PG_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "127.0.0.1:${TOXIPROXY_PORT:-8502}:8474" # Toxiproxy API, used by run.sh
    depends_on:
      - postgres-claims

  # The Toxiproxy image is distroless (no shell, no CLI), so the proxy is
  # created through its HTTP API.
  toxiproxy-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - toxiproxy
    entrypoint:
      - sh
      - -c
      - >
        until curl -sf http://toxiproxy:8474/version; do sleep 1; done;
        curl -sf -X POST http://toxiproxy:8474/proxies -H 'Content-Type: application/json'
        -d '{"name":"postgres","listen":"0.0.0.0:5433","upstream":"postgres-claims:5432","enabled":true}'

  moto:
    image: motoserver/moto:5.2.3
    ports:
      - "127.0.0.1:${MOTO_PORT:-5130}:5000"
    environment:
      - MOTO_COGNITO_IDP_USER_POOL_ID_STRATEGY=HASH
      - MOTO_COGNITO_IDP_USER_POOL_CLIENT_ID_STRATEGY=HASH
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      timeout: 2s
      retries: 15

  claims:
    build:
      context: ../../..
      dockerfile: services/claims/Dockerfile
    ports:
      - "127.0.0.1:${CLAIMS_PORT:-8302}:8080"
    environment:
      - PORT=8080
      # Through Toxiproxy, so run.sh can slow the database down or cut it.
      - DATABASE_URL=postgres://claims:${PG_PASSWORD:-}@toxiproxy:5433/claims?sslmode=disable
      - REDIS_ADDR=redis:6379
      - CLAIM_READ_BUDGET_MS=900
      - CLAIM_READ_CACHE_TTL_SECONDS=300
      # Cognito of Moto, written by run.sh after seeding it.
      - AUTH_ISSUER=${AUTH_ISSUER:-}
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-}
      - AUTH_CLIENT_IDS=${AUTH_CLIENT_IDS:-}
    depends_on:
      postgres-claims:
        condition: service_healthy
      redis:
        condition: service_healthy
      moto:
        condition: service_healthy
      # The proxy is created by run.sh (toxiproxy-init) before claims starts.
      toxiproxy:
        condition: service_started

  # Started on demand by run.sh (docker compose run --rm k6 ...).
  k6:
    image: grafana/k6:0.54.0
    profiles: ["tools"]
    entrypoint: ["k6"]
    environment:
      - BASE_URL=http://claims:8080
    volumes:
      - ./k6:/scripts:ro
