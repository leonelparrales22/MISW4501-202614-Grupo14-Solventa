# HU-W4.2-02 end-to-end scenario: the real audit and origination services, the
# PostgreSQL of each, Redis, the Open Finance stub behind Toxiproxy and Moto as
# the Cognito of the human routes. Copy of tests/e2e/hu-m1.3 without LocalStack:
# the link between the insured account and the document is seeded by SQL, so no
# SNS topic nor SQS queue is needed. Run it with ./run.sh, which generates the
# local secrets (never printed), seeds Moto and drives the scenarios. Build
# context is the repository root.
#
# The Open Finance stub behind Toxiproxy receives the profile queries of
# origination (proxy openfinance) and the revocation notices of audit (proxy
# openfinance-revocations, which run.sh disables to leave a revocation partial);
# origination verifies the consent with the real audit (AUDIT_URL) and audit
# notifies the entities with a deadline shortened to 5 s.
#
# Published ports (127.0.0.1 only, configurable, chosen not to collide with the
# other scenarios): audit 8490, origination 8491, Moto 5140, the Open Finance
# stub 9490 and the Toxiproxy API 8495.
name: hu-w4-2-e2e

services:
  postgres-audit:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=audit
      - POSTGRES_USER=audit
      - POSTGRES_PASSWORD=${PG_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres-origination:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=origination
      - POSTGRES_USER=origination
      - POSTGRES_PASSWORD=${PG_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origination -d origination"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  openfinance:
    build:
      context: ../../..
      dockerfile: stubs/openfinance/Dockerfile
    ports:
      - "127.0.0.1:${OPENFINANCE_PORT:-9490}:9000" # GET /debug/consent-revocations, used by run.sh
    environment:
      PORT: "9000"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "127.0.0.1:${TOXIPROXY_PORT:-8495}:8474" # Toxiproxy API, used by run.sh
    depends_on:
      - openfinance

  # The Toxiproxy image is distroless (no shell, no CLI), so the proxies are
  # created through its HTTP API: one for the profiles of origination, one for
  # the notices of audit, so the connections of each can be told apart.
  toxiproxy-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - toxiproxy
    entrypoint:
      - sh
      - -c
      - >
        until curl -sf http://toxiproxy:8474/version; do sleep 1; done;
        curl -sf -o /dev/null -X POST http://toxiproxy:8474/populate -H 'Content-Type: application/json'
        -d '[{"name":"openfinance","listen":"0.0.0.0:9001","upstream":"openfinance:9000","enabled":true},
        {"name":"openfinance-revocations","listen":"0.0.0.0:9002","upstream":"openfinance:9000","enabled":true}]'

  moto:
    image: motoserver/moto:5.2.3
    ports:
      - "127.0.0.1:${MOTO_PORT:-5140}:5000"
    environment:
      - MOTO_COGNITO_IDP_USER_POOL_ID_STRATEGY=HASH
      - MOTO_COGNITO_IDP_USER_POOL_CLIENT_ID_STRATEGY=HASH
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      timeout: 2s
      retries: 15

  audit:
    build:
      context: ../../..
      dockerfile: services/audit/Dockerfile
    ports:
      - "127.0.0.1:${AUDIT_PORT:-8490}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://audit:${PG_PASSWORD:-}@postgres-audit:5432/audit?sslmode=disable
      # Cognito of Moto, written by run.sh after seeding it.
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_CLIENT_IDS: ${AUTH_CLIENT_IDS:-}
      PARTNER_DISPLAY_NAMES: '{"aliado-banco-1":"Banco Aliado"}'
      LOG_LEVEL: debug
      # The notices of the revocations, with a short deadline.
      OPEN_FINANCE_URL: http://toxiproxy:9002
      REVOCATION_NOTICE_DEADLINE_SECONDS: ${REVOCATION_DEADLINE_SECONDS:-5}
      REVOCATION_NOTICE_POLL_INTERVAL_MS: "500"
    depends_on:
      postgres-audit:
        condition: service_healthy
      moto:
        condition: service_healthy
      toxiproxy-init:
        condition: service_completed_successfully

  origination:
    build:
      context: ../../..
      dockerfile: services/origination/Dockerfile
    ports:
      - "127.0.0.1:${ORIGINATION_PORT:-8491}:8080"
    environment:
      PORT: "8080"
      REDIS_ADDR: redis:6379
      # The profiles go to the stub through Toxiproxy, and the consent is
      # verified with the real audit before any query.
      OPEN_FINANCE_URL: http://toxiproxy:9001
      AUDIT_URL: http://audit:8080
      DATABASE_URL: postgres://origination:${PG_PASSWORD:-}@postgres-origination:5432/origination?sslmode=disable
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_CLIENT_IDS: ${AUTH_CLIENT_IDS:-}
      DOCUMENTS_DIR: /tmp/documents
    depends_on:
      postgres-origination:
        condition: service_healthy
      redis:
        condition: service_healthy
      moto:
        condition: service_healthy
      toxiproxy-init:
        condition: service_completed_successfully
