# HU-M1.3-01 end-to-end scenario: the real origination and audit services,
# the PostgreSQL of each, LocalStack with the SNS topic of origination and the
# SQS queue of audit with its DLQ (created by localstack/init-messaging.sh like
# infra/terraform/modules/messaging), and Moto as the Cognito of the sign-up
# and of the human routes. Run it with ./run.sh, which generates the local
# secrets (never printed), seeds Moto and drives the scenarios. Build context
# is the repository root.
#
# Published ports (127.0.0.1 only, configurable, chosen not to collide with
# tests/e2e/hu-w1.2): audit 8390, origination 8391, LocalStack 4576, Moto 5130,
# the Open Finance stub 9390 and the Toxiproxy API 8394.
#
# HU-M1.3-02: the Open Finance stub behind Toxiproxy receives the profile
# queries of origination (proxy openfinance) and the revocation notices of
# audit (proxy openfinance-revocations); origination verifies the consent with
# the real audit (AUDIT_URL) and audit notifies the entities with a deadline
# shortened to 5 s.
name: hu-m1-3-e2e

x-aws-local: &aws-local
  AWS_REGION: us-east-2
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_EC2_METADATA_DISABLED: "true"

services:
  postgres-audit:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=audit
      - POSTGRES_USER=audit
      - POSTGRES_PASSWORD=${PG_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres-origination:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=origination
      - POSTGRES_USER=origination
      - POSTGRES_PASSWORD=${PG_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origination -d origination"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # LocalStack 4.14.0: the last image that starts without an auth token
  # (decision D-10 a of HA-D02). It keeps nothing on restart; the ready hook
  # recreates the topic, the queues and the subscription with the same names,
  # so their ARNs and URLs do not change (scenario E9).
  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4576}:4566"
    environment:
      - SERVICES=sns,sqs
      - AWS_DEFAULT_REGION=us-east-2
    volumes:
      - ./localstack/init-messaging.sh:/etc/localstack/init/ready.d/init-messaging.sh:ro
    # Healthy once the ready hook subscribed the queue to the last topic (a
    # marker file would survive a stop/start and pass before the hook runs).
    healthcheck:
      test: ["CMD-SHELL", "awslocal --region us-east-2 sns list-subscriptions-by-topic --topic-arn arn:aws:sns:us-east-2:000000000000:solventa-local-claims --query 'length(Subscriptions)' --output text | grep -q '^1$'"]
      interval: 3s
      timeout: 10s
      retries: 60

  # HU-M1.3-02: the Open Finance provider. The entity aliado-mudo never answers
  # its notices (503), to show the partial revocation (R7).
  openfinance:
    build:
      context: ../../..
      dockerfile: stubs/openfinance/Dockerfile
    ports:
      - "127.0.0.1:${OPENFINANCE_PORT:-9390}:9000" # GET /debug/consent-revocations, used by run.sh
    environment:
      PORT: "9000"
      REVOCATION_UNRESPONSIVE_ENTITIES: ${REVOCATION_UNRESPONSIVE_ENTITIES:-aliado-mudo}

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "127.0.0.1:${TOXIPROXY_PORT:-8394}:8474" # Toxiproxy API
    depends_on:
      - openfinance

  # The Toxiproxy image is distroless (no shell, no CLI), so the proxies are
  # created through its HTTP API: one for the profiles of origination, one for
  # the notices of audit, so the connections of each can be told apart.
  # /populate creates or replaces them, so it runs again without failing when
  # audit or origination restart (both depend on it).
  toxiproxy-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - toxiproxy
    entrypoint:
      - sh
      - -c
      - >
        until curl -sf http://toxiproxy:8474/version; do sleep 1; done;
        curl -sf -o /dev/null -X POST http://toxiproxy:8474/populate -H 'Content-Type: application/json'
        -d '[{"name":"openfinance","listen":"0.0.0.0:9001","upstream":"openfinance:9000","enabled":true},
        {"name":"openfinance-revocations","listen":"0.0.0.0:9002","upstream":"openfinance:9000","enabled":true}]'

  moto:
    image: motoserver/moto:5.2.3
    ports:
      - "127.0.0.1:${MOTO_PORT:-5130}:5000"
    environment:
      - MOTO_COGNITO_IDP_USER_POOL_ID_STRATEGY=HASH
      - MOTO_COGNITO_IDP_USER_POOL_CLIENT_ID_STRATEGY=HASH
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      timeout: 2s
      retries: 15

  audit:
    build:
      context: ../../..
      dockerfile: services/audit/Dockerfile
    ports:
      - "127.0.0.1:${AUDIT_PORT:-8390}:8080"
    environment:
      <<: *aws-local
      PORT: "8080"
      DATABASE_URL: postgres://audit:${PG_PASSWORD:-}@postgres-audit:5432/audit?sslmode=disable
      # Cognito of Moto, written by run.sh after seeding it.
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_CLIENT_IDS: ${AUTH_CLIENT_IDS:-}
      PARTNER_DISPLAY_NAMES: '{"aliado-banco-1":"Banco Aliado"}'
      # HU-M1.3-01: the CustomerLinked events arrive by the audit queue.
      EVENTS_QUEUE_URL: http://localstack:4566/000000000000/solventa-local-audit
      AWS_ENDPOINT_URL_SQS: http://localstack:4566
      LOG_LEVEL: debug
      # HU-M1.3-02: the notices of the revocations, with a short deadline.
      OPEN_FINANCE_URL: http://toxiproxy:9002
      REVOCATION_NOTICE_DEADLINE_SECONDS: ${REVOCATION_DEADLINE_SECONDS:-5}
      REVOCATION_NOTICE_POLL_INTERVAL_MS: "500"
    depends_on:
      postgres-audit:
        condition: service_healthy
      moto:
        condition: service_healthy
      localstack:
        condition: service_healthy
      toxiproxy-init:
        condition: service_completed_successfully

  origination:
    build:
      context: ../../..
      dockerfile: services/origination/Dockerfile
    ports:
      - "127.0.0.1:${ORIGINATION_PORT:-8391}:8080"
    environment:
      <<: *aws-local
      PORT: "8080"
      REDIS_ADDR: redis:6379
      # HU-M1.3-02 (R2): the profiles go to the stub through Toxiproxy, and the
      # consent is verified with the real audit before any query.
      OPEN_FINANCE_URL: http://toxiproxy:9001
      AUDIT_URL: http://audit:8080
      DATABASE_URL: postgres://origination:${PG_PASSWORD:-}@postgres-origination:5432/origination?sslmode=disable
      # Human routes and sign-up of the insured (HU-M1.1-01) against Moto.
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_CLIENT_IDS: ${AUTH_CLIENT_IDS:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      AWS_ENDPOINT_URL_COGNITO_IDENTITY_PROVIDER: http://moto:5000
      DOCUMENTS_DIR: /tmp/documents
      # HU-M1.3-01: the outbox relay publishes CustomerLinked to LocalStack.
      EVENTS_TOPIC_ARN: arn:aws:sns:us-east-2:000000000000:solventa-local-origination
      AWS_ENDPOINT_URL_SNS: http://localstack:4566
      OUTBOX_POLL_INTERVAL_MS: "500"
    depends_on:
      postgres-origination:
        condition: service_healthy
      redis:
        condition: service_healthy
      moto:
        condition: service_healthy
      localstack:
        condition: service_healthy
      toxiproxy-init:
        condition: service_completed_successfully
