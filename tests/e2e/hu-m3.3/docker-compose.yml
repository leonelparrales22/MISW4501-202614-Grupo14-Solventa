# HU-M3.3-01 local backend for the mobile app (notification of every change of
# stage of a claim): the real claims and notifications services with their
# PostgreSQL, LocalStack with the claims topic and the notifications queue
# (localstack/init-messaging.sh), the policy core, payment gateway and push
# stubs, and an nginx in front of both services (gateway.conf) so the app has
# one base URL, like the API Gateway in AWS. The human routes verify the
# tokens of the permanent user pool (written by app-local.sh), so the insured
# signs in on the emulator. Build context is the repository root.
#
# Published ports (127.0.0.1 only, configurable): the gateway 8395 (the one the
# app calls), LocalStack 4579 and the push stub 9395 (GET /messages shows what
# the device would have got).
name: hu-m3-3-local

x-aws-local: &aws-local
  AWS_REGION: us-east-2
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_EC2_METADATA_DISABLED: "true"

services:
  postgres-claims:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=claims
      - POSTGRES_USER=claims
      - POSTGRES_PASSWORD=${PG_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres-notifications:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=notifications
      - POSTGRES_USER=notifications
      - POSTGRES_PASSWORD=${PG_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 2s
      timeout: 2s
      retries: 30

  # LocalStack 4.14.0: the last image that starts without an auth token
  # (decision D-10 a of HA-D02).
  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4579}:4566"
    environment:
      - SERVICES=sns,sqs
      - AWS_DEFAULT_REGION=us-east-2
    volumes:
      - ./localstack/init-messaging.sh:/etc/localstack/init/ready.d/init-messaging.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal --region us-east-2 sns list-subscriptions-by-topic --topic-arn arn:aws:sns:us-east-2:000000000000:solventa-local-claims --query 'length(Subscriptions)' --output text | grep -q '^1$'"]
      interval: 3s
      timeout: 10s
      retries: 60

  policy-core:
    build:
      context: ../../..
      dockerfile: stubs/policy-core/Dockerfile
    environment:
      - PORT=9060

  payment-gateway:
    build:
      context: ../../..
      dockerfile: stubs/payment-gateway/Dockerfile
    environment:
      - PORT=9040

  push:
    build:
      context: ../../..
      dockerfile: stubs/push/Dockerfile
    ports:
      - "127.0.0.1:${PUSH_PORT:-9395}:9070"
    environment:
      PORT: "9070"

  claims:
    build:
      context: ../../..
      dockerfile: services/claims/Dockerfile
    environment:
      <<: *aws-local
      PORT: "8080"
      DATABASE_URL: postgres://claims:${PG_PASSWORD:-}@postgres-claims:5432/claims?sslmode=disable
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_CLIENT_IDS: ${AUTH_CLIENT_IDS:-}
      POLICY_CORE_URL: http://policy-core:9060
      PAYMENT_GATEWAY_URL: http://payment-gateway:9040
      # HU-M3.3-01: the outbox relay publishes ClaimStageChanged here.
      EVENTS_TOPIC_ARN: arn:aws:sns:us-east-2:000000000000:solventa-local-claims
      AWS_ENDPOINT_URL_SNS: http://localstack:4566
      TRIAGE_SWEEP_INTERVAL_SECONDS: "2"
    depends_on:
      postgres-claims:
        condition: service_healthy
      localstack:
        condition: service_healthy
      policy-core:
        condition: service_started
      payment-gateway:
        condition: service_started

  notifications:
    build:
      context: ../../..
      dockerfile: services/notifications/Dockerfile
    environment:
      <<: *aws-local
      PORT: "8080"
      DATABASE_URL: postgres://notifications:${PG_PASSWORD:-}@postgres-notifications:5432/notifications?sslmode=disable
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_CLIENT_IDS: ${AUTH_CLIENT_IDS:-}
      EVENTS_QUEUE_URL: http://localstack:4566/000000000000/solventa-local-notifications
      AWS_ENDPOINT_URL_SQS: http://localstack:4566
      PUSH_PROVIDER_URL: http://push:9070
    depends_on:
      postgres-notifications:
        condition: service_healthy
      localstack:
        condition: service_healthy
      push:
        condition: service_started

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8395}:8080"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - claims
      - notifications
