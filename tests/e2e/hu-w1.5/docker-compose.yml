# HU-W1.5 end-to-end scenario of the assisted renewal (HU-W1.5-03): the real
# audit and origination services with their PostgreSQL, Redis, the Open
# Finance / Open Data / KYC stubs behind Toxiproxy, the payment gateway and
# e-mail stubs and Moto as the Cognito of the human routes. Run it with
# ./assisted-renewal.sh, which generates the local secrets (never printed),
# seeds Moto, buys the policies through the real journey and drives the
# scenarios. Build context is the repository root.
#
# The renewal window is a year (RENEWAL_WINDOW_DAYS=365, as in the staging
# window), so a policy of 12 months bought now can be renewed at once.
#
# Published ports (127.0.0.1 only, configurable): audit 8590, origination
# 8591, Toxiproxy API 8594, Moto 5190, the e-mail stub 9191 and the payment
# gateway 9194.
name: hu-w1-5-e2e

services:
  postgres-audit:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=audit
      - POSTGRES_USER=audit
      - POSTGRES_PASSWORD=${PG_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres-origination:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=origination
      - POSTGRES_USER=origination
      - POSTGRES_PASSWORD=${PG_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origination -d origination"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  email:
    build:
      context: ../../..
      dockerfile: stubs/email/Dockerfile
    ports:
      - "127.0.0.1:${EMAIL_PORT:-9191}:9030"
    environment:
      - PORT=9030

  payment-gateway:
    build:
      context: ../../..
      dockerfile: stubs/payment-gateway/Dockerfile
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-9194}:9040"
    environment:
      - PORT=9040

  openfinance:
    build:
      context: ../../..
      dockerfile: stubs/openfinance/Dockerfile
    environment:
      - PORT=9000

  opendata:
    build:
      context: ../../..
      dockerfile: stubs/opendata/Dockerfile
    environment:
      - PORT=9010

  kyc:
    build:
      context: ../../..
      dockerfile: stubs/kyc/Dockerfile
    environment:
      - PORT=9020

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "127.0.0.1:${TOXIPROXY_PORT:-8594}:8474" # Toxiproxy API, used by assisted-renewal.sh
    depends_on:
      - openfinance
      - opendata
      - kyc

  # The Toxiproxy image is distroless (no shell, no CLI), so the proxies are
  # created through its HTTP API.
  toxiproxy-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - toxiproxy
    entrypoint:
      - sh
      - -c
      - >
        until curl -sf http://toxiproxy:8474/version; do sleep 1; done;
        curl -sf -X POST http://toxiproxy:8474/proxies -H 'Content-Type: application/json'
        -d '{"name":"openfinance","listen":"0.0.0.0:9001","upstream":"openfinance:9000","enabled":true}' &&
        curl -sf -X POST http://toxiproxy:8474/proxies -H 'Content-Type: application/json'
        -d '{"name":"opendata","listen":"0.0.0.0:9011","upstream":"opendata:9010","enabled":true}' &&
        curl -sf -X POST http://toxiproxy:8474/proxies -H 'Content-Type: application/json'
        -d '{"name":"kyc","listen":"0.0.0.0:9021","upstream":"kyc:9020","enabled":true}'

  moto:
    image: motoserver/moto:5.2.3
    ports:
      - "127.0.0.1:${MOTO_PORT:-5190}:5000"
    environment:
      - MOTO_COGNITO_IDP_USER_POOL_ID_STRATEGY=HASH
      - MOTO_COGNITO_IDP_USER_POOL_CLIENT_ID_STRATEGY=HASH
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      timeout: 2s
      retries: 15

  audit:
    build:
      context: ../../..
      dockerfile: services/audit/Dockerfile
    ports:
      - "127.0.0.1:${AUDIT_PORT:-8590}:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://audit:${PG_PASSWORD:-}@postgres-audit:5432/audit?sslmode=disable
      # Cognito of Moto, written by assisted-renewal.sh after seeding it: the
      # compliance portal revokes a consent as operations (HU-W4.2-02).
      - AUTH_ISSUER=${AUTH_ISSUER:-}
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-}
      - AUTH_CLIENT_IDS=${AUTH_CLIENT_IDS:-}
    depends_on:
      postgres-audit:
        condition: service_healthy
      moto:
        condition: service_healthy

  origination:
    build:
      context: ../../..
      dockerfile: services/origination/Dockerfile
    ports:
      - "127.0.0.1:${ORIGINATION_PORT:-8591}:8080"
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - OPEN_FINANCE_URL=http://toxiproxy:9001
      - OPEN_DATA_URL=http://toxiproxy:9011
      - KYC_URL=http://toxiproxy:9021
      # The consent of the embedded policies is verified with the real audit.
      - AUDIT_URL=http://audit:8080
      - DATABASE_URL=postgres://origination:${PG_PASSWORD:-}@postgres-origination:5432/origination?sslmode=disable
      # The premium charge (HA-D02): the renewal and the assisted renewal are
      # mounted with it.
      - PAYMENT_GATEWAY_URL=http://payment-gateway:9040
      - EMAIL_URL=http://email:9030
      - DOCUMENTS_DIR=/tmp/documents
      - DOCUMENT_LINK_SECRET=${DOCUMENT_LINK_SECRET:-}
      - DOCUMENTS_PUBLIC_BASE_URL=http://localhost:${ORIGINATION_PORT:-8591}
      # Human routes against Moto, written by assisted-renewal.sh.
      - AUTH_ISSUER=${AUTH_ISSUER:-}
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-}
      - AUTH_CLIENT_IDS=${AUTH_CLIENT_IDS:-}
      # HU-W1.5-02: a policy of 12 months is renewable at once, and the sweep
      # settles the renewals every second.
      - RENEWAL_WINDOW_DAYS=365
      - RENEWAL_POLL_INTERVAL_MS=1000
      - OFFER_LINK_BASE_URL=http://localhost:4200
    depends_on:
      postgres-origination:
        condition: service_healthy
      email:
        condition: service_started
      payment-gateway:
        condition: service_started
      moto:
        condition: service_healthy
      redis:
        condition: service_healthy
      toxiproxy-init:
        condition: service_completed_successfully
