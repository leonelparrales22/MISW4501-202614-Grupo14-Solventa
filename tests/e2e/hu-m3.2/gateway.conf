# The one address the app calls (URL_API_LOCAL), as the API Gateway does in
# AWS: the notification center and the devices go to notifications, the rest
# of /v1 to origination (HU-M3.2-01: the expiry alert opens the policy in the
# wallet, GET /v1/policies, so the app needs both behind the same base URL).
server {
    listen 8080;
    location /v1/notifications { proxy_pass http://notifications:8080; }
    location /v1/devices       { proxy_pass http://notifications:8080; }
    location /                 { proxy_pass http://origination:8080; }
}
