openapi: 3.0.3
info:
  title: Solventa - audit service
  version: 0.5.0
  description: >
    Audit and consents. HU-W1.2-01: the explicit, immutable consent of the
    customer to be profiled. HU-M1.3-01: the insured reads their own consents
    under /v1/consents (one prefix per resource, plural noun; people use
    /v1/consents with Cognito, banks use /v1/audit/* with an API key).
    HU-M1.3-02: the insured revokes a consent and downloads the receipt; the
    revocation is recorded immutably before the answer, the consent stops
    being verified as active at once and every entity is notified within 5
    minutes. HU-W4.2-02: the compliance portal (operations role) reads the
    revocation state of a consent, revokes it with a reason and a reference
    and retries the entities that did not confirm, reusing the process of
    HU-M1.3-02 under /v1/audit/consents/{consent_id}. The consent routes are
    mounted only when the service has its DATABASE_URL; the evidence lookup,
    the holder's routes and the compliance routes also need AUTH_*. 0.5.0 is
    also the first version that declares the decision routes of HU-W4.1-01.
paths:
  /health:
    get:
      summary: Shallow health check (ALB, ADR-02)
      security: []
      responses:
        "200":
          description: OK
  /v1/audit/consent-terms/current:
    get:
      summary: Current consent terms (HU-W1.2-01 CA-1)
      description: >
        The terms the customer must see before consenting: the purpose, who
        controls the data, the data policy and, for each source, which data it
        reads and for how long the consent lasts. The grant must send the
        version shown here.
      security: []
      responses:
        "200":
          description: The current terms
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentTerms"
              example:
                version: v1
                purpose: risk_profiling_mortgage_life_offer
                controller: Solventa S.A.
                policy_ref: personal-data-policy-v1
                sources:
                  - code: open_finance
                    data_categories: [credit_products, balances, payment_behavior]
                    validity: 12_months
                  - code: open_data
                    data_categories: [public_records]
                    validity: 12_months
                  - code: kyc
                    data_categories: [identity_verification]
                    validity: single_use
  /v1/audit/consents:
    post:
      summary: Record the explicit consent of the customer (HU-W1.2-01 CA-2)
      description: >
        Records the consent with the holder, a copy of the scope, the server
        date and time (granted_at) and the channel. The customer must accept
        every source (all or nothing) and the data policy. Granting again for
        the same customer, application and terms version is idempotent: it
        answers 200 with the stored consent and records nothing. The record is
        immutable (HU-W1.2-01 CA-4). The user agent is taken from the request
        header. The receipt does not repeat the holder's document.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantConsentRequest"
            example:
              customer_id: cust-1
              document_id: "1020304050"
              full_name: Ana María Pérez
              terms_version: v1
              accepted_sources: [open_finance, open_data, kyc]
              accepted_data_policy: true
              channel: embedded
              partner_id: partner-1
              application_id: app-1
      responses:
        "201":
          description: Consent recorded
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentReceipt"
          links:
            GetConsentEvidence:
              operationId: getConsentEvidence
              parameters:
                consent_id: $response.body#/consent_id
        "200":
          description: The consent for that customer, application and terms version already existed
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentReceipt"
          links:
            GetConsentEvidence:
              operationId: getConsentEvidence
              parameters:
                consent_id: $response.body#/consent_id
        "400":
          description: Malformed body or invalid fields (every invalid field is listed)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"
        "409":
          description: The terms version is not the current one (terms_outdated); show the current terms again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The consent could not be recorded; nothing was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/audit/consent-verifications:
    get:
      summary: Verify whether a customer has an active consent (HU-W1.2-01 CA-3)
      description: >
        Internal route, called by origination before it queries any source. It
        carries no token: it must be reachable only from inside the network
        and is not published to the partners. A customer without a consent is
        not an error: the answer is active=false. An expired consent answers
        active=false with its evidence.
      security: []
      parameters:
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: The verification
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentVerification"
        "400":
          description: customer_id is missing or too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The consent could not be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/audit/consents/{consent_id}:
    get:
      operationId: getConsentEvidence
      summary: Consent evidence (HU-W1.2-01 CA-2)
      description: >
        The full record of a consent, with the holder. Human route: only the
        operations and advisor roles of the Cognito pool read it.
      security:
        - cognitoJwt: []
      parameters:
        - name: consent_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: The consent evidence
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentEvidence"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The role may not read consents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: There is no consent with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The consent could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/audit/consents/{consent_id}/revocation:
    get:
      operationId: getComplianceRevocationState
      summary: Revocation state of a consent for the compliance portal (HU-W4.2-02 CA-1, CA-3, CA-4, CA-5)
      description: >
        What the compliance portal needs to confirm, follow and retry a
        revocation: the holder (full name and masked document), the scope, the
        entities, whether the consent can still be revoked (revocable), the
        revocation with who requested it, why, the reference and the state of
        the notice to each entity with the time its window ended, and the
        history. The portal polls it every 5 seconds while notice_status is
        in_progress or an entity is still pending (the window of a retry).
        Human route: only the operations role.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ComplianceConsentID"
      responses:
        "200":
          description: The state of the consent
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceRevocationState"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The role is not operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: There is no consent with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The state could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/audit/consents/{consent_id}/revocations:
    post:
      operationId: revokeConsentFromPortal
      summary: The compliance portal revokes a consent (HU-W4.2-02 CA-1, CA-2, CA-4, CA-5, CA-6)
      description: >
        Reuses the revocation of HU-M1.3-02: the immutable record (actor
        operations with the sub of the token, channel compliance_portal,
        reason, reference, a copy of the scope, requested_at and effective_at
        at the server time) and the queue of notices are written in one
        transaction before the answer. From effective_at the consent is not
        verified as active, so origination stops querying the sources, and
        every entity is notified within 5 minutes. Nothing is recorded when a
        field is missing or role_confirmed is not true. Idempotent by the
        Idempotency-Key header: the same key returns the stored revocation
        with 200; another key on a revoked (also by the holder from the app)
        consent is 409 consent_already_revoked. Human route: only the
        operations role.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ComplianceConsentID"
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID generated by the portal when it opens the confirmation modal.
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceRevokeRequest"
            example:
              reason: customer_request
              reference: TCK-2026-0412
              role_confirmed: true
      responses:
        "201":
          description: The consent was revoked now
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceRevocationState"
        "200":
          description: The same Idempotency-Key already revoked it; the stored revocation
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceRevocationState"
        "400":
          description: >
            validation_failed names every invalid field at once (reason,
            reference, role_confirmed, Idempotency-Key) and nothing is
            recorded; invalid_request when the body is not JSON or has an
            unknown field.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The role is not operations; nothing is executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: There is no consent with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            consent_already_revoked when the consent was already revoked (from
            the portal or from the holder's app, also partially);
            consent_not_active when it expired; idempotency_key_reused when
            the key already revoked another consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The revocation could not be recorded; nothing changed, try again with the same key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/audit/consents/{consent_id}/revocation-retries:
    post:
      operationId: retryConsentRevocationNotices
      summary: Retry the entities that did not confirm a revocation (HU-W4.2-02 CA-3)
      description: >
        Only for a partially revoked consent with an entity that did not
        confirm. Starts a new 5-minute window for the entities that did not
        confirm, and only for them: an entity that confirmed is never
        notified again. Leaves a revocation_retry_requested event with the
        actor. The revocation stays partially_revoked (notice_status partial)
        while the entity waits in its new window, as pending, until it
        confirms. It takes no body and no Idempotency-Key: a second retry
        while the new window is open is 409 nothing_to_retry. Human route:
        only the operations role.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ComplianceConsentID"
      responses:
        "202":
          description: The retry was recorded; the entities are notified again within the new window
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceRetryResult"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The role is not operations; nothing is executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: There is no consent with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            consent_not_revoked when the consent has no revocation;
            nothing_to_retry when the notice is in_progress or completed, or
            every entity that did not confirm is already in a retry window
            (the message carries the notice_status).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The retry could not be recorded; nothing changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/audit/decisions:
    post:
      operationId: recordDecision
      summary: Record an underwriting decision (HU-W4.1-01)
      description: >
        Internal route origination calls for every offer it prices. It carries
        no Cognito token and must be reachable only from inside the network.
        The record is append-only and idempotent by `offer_id`: sending the
        same offer again returns the stored record and never replaces it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRecord"
      responses:
        "201":
          description: The decision was recorded
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionRecord"
        "200":
          description: A decision for that offer already existed; it is returned unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionRecord"
        "400":
          description: Malformed body (invalid_request) or invalid fields (validation_failed)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
        "503":
          description: The decision could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/audit/decisions/{offer_id}:
    get:
      operationId: getDecision
      summary: Audit record of an underwriting decision (HU-W4.1-01)
      description: >
        Read-only. Human route: only the operations role of the Cognito pool
        reads it. The identifier is the id of the offer or the number of the
        partner's application (then the most recent decision of that
        application). An unknown id answers 404 with a generic message.
      security:
        - cognitoJwt: []
      parameters:
        - name: offer_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: The audit record
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionRecord"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The role may not read audit records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No audit record for that identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The record could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/consents:
    get:
      operationId: listHolderConsents
      summary: The consents of the insured (HU-M1.3-01 CA-1, CA-3, CA-5)
      description: >
        Every consent granted with the document linked to the account of the
        token, the current ones first (by granted_at, newest first) and then
        the revoked or expired ones (by ended_at, newest first). Each item
        carries its detail and history, so the mobile client keeps a complete
        offline copy with one call; there is no pagination. Human route: only
        the insured role reads it, and the holder is always the account of the
        token. The account is recognized by the CustomerLinked event
        origination publishes at the end of the registration; until it
        arrives the answer is 403 holder_not_linked. Read-only: no other
        method exists (CA-4). The response never repeats the holder's
        document nor name.
      security:
        - cognitoJwt: []
      responses:
        "200":
          description: The consents of the holder
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HolderConsentList"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            forbidden when the role is not insured; holder_not_linked when the
            account has no link to a document yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The consents could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/consents/{consent_id}:
    get:
      operationId: getHolderConsent
      summary: One consent of the insured (HU-M1.3-01 CA-2, CA-6)
      description: >
        The detail of a consent of the holder of the token, with its history.
        A consent that does not exist and a consent of another holder get the
        same 404, so the ids of others are never revealed (CA-6).
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/HolderConsentID"
      responses:
        "200":
          description: The consent of the holder
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HolderConsent"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            forbidden when the role is not insured; holder_not_linked when the
            account has no link to a document yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: There is no consent with that id for this holder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The consent could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/consents/{consent_id}/revocations:
    post:
      operationId: revokeHolderConsent
      summary: The insured revokes one of their consents (HU-M1.3-02 CA-3, CA-4, CA-5, CA-6)
      description: >
        Records the revocation before answering (CA-4): the immutable record
        with the holder, the consent, a copy of the scope, requested_at (the
        time the holder confirmed it on the device, kept even when the app
        sends it later from its offline queue, CA-5), effective_at (the
        server time), the channel and the device. From effective_at the
        consent is not verified as active, so origination stops querying the
        sources (CA-3); the notice to each entity follows within 5 minutes and
        its state is in entities and notice_status. Idempotent by the
        Idempotency-Key header (a UUID generated when the holder confirms):
        the same key returns the same revocation with 200; another key on a
        revoked consent is 409 consent_already_revoked (CA-6). Human route:
        only the insured role, and the holder is the account of the token.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/HolderConsentID"
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID generated by the app when the holder confirms the revocation.
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeConsentRequest"
            example:
              requested_at: "2026-10-24T14:59:58-05:00"
              device: Google Pixel 8
              confirmation_method: biometric
      responses:
        "201":
          description: The consent was revoked now
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revocation"
        "200":
          description: The same Idempotency-Key already revoked it; the stored revocation
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revocation"
        "400":
          description: >
            validation_failed names each invalid field (requested_at, device,
            confirmation_method, Idempotency-Key); invalid_request when the
            body is not JSON.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            forbidden when the role is not insured; holder_not_linked when the
            account has no link to a document yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: There is no consent with that id for this holder (it does not exist or is of another holder)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            consent_not_active when the consent expired; consent_already_revoked
            when another request revoked it (CA-6); idempotency_key_reused when
            the key already revoked another consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The revocation could not be recorded; nothing changed, try again with the same key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/consents/{consent_id}/revocation-receipt:
    get:
      operationId: getRevocationReceipt
      summary: The receipt of the revocation, in PDF (HU-M1.3-02 CA-4)
      description: >
        Generated on request from the immutable record, so the same
        revocation always gives the same document: the receipt number, the
        consent, the entity, the holder (document masked), the revoked scope,
        the request and the exact date and time the authorization ended, the
        channel and the device. Spanish by default; English with an
        Accept-Language starting with en.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/HolderConsentID"
        - name: Accept-Language
          in: header
          required: false
          schema:
            type: string
            maxLength: 64
            pattern: "^[A-Za-z0-9 ,;=.*-]*$"
            example: es-CO
      responses:
        "200":
          description: The receipt
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="REV-2026-0088.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            forbidden when the role is not insured; holder_not_linked when the
            account has no link to a document yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The consent is not revoked, does not exist or is of another holder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The receipt could not be generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    HolderConsentID:
      name: consent_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9_-]+$"
    ComplianceConsentID:
      name: consent_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ID token of the Cognito user pool (HA-S01).
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - terms_outdated
            - consent_not_found
            - not_found
            - decision_not_found
            - holder_not_linked
            - consent_not_active
            - consent_already_revoked
            - consent_not_revoked
            - nothing_to_retry
            - idempotency_key_reused
            - service_unavailable
            - unauthorized
            - forbidden
        message:
          type: string
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
          enum: [required, invalid, invalid_format, out_of_range, incomplete, must_be_true, too_many]
    ValidationError:
      type: object
      required: [error, message, fields]
      properties:
        error:
          type: string
          enum: [validation_failed]
        message:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    SourceTerm:
      type: object
      required: [code, data_categories, validity]
      properties:
        code:
          type: string
          enum: [open_finance, open_data, kyc]
        data_categories:
          type: array
          items:
            type: string
        validity:
          type: string
          description: single_use is for one profiling; until its use is recorded it lasts as long as the consent.
          enum: [12_months, single_use]
    ConsentTerms:
      type: object
      required: [version, purpose, controller, policy_ref, sources]
      properties:
        version:
          type: string
        purpose:
          type: string
        controller:
          type: string
        policy_ref:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceTerm"
    GrantConsentRequest:
      type: object
      required:
        - customer_id
        - document_id
        - full_name
        - terms_version
        - accepted_sources
        - accepted_data_policy
        - channel
        - partner_id
        - application_id
      properties:
        customer_id:
          type: string
          description: The customer id of the partner (the one origination later asks about).
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
        document_id:
          type: string
          minLength: 5
          maxLength: 20
          pattern: '^[A-Za-z0-9]+$'
        full_name:
          type: string
          minLength: 3
          maxLength: 120
        terms_version:
          type: string
          description: The version shown to the customer (GET /v1/audit/consent-terms/current).
        accepted_sources:
          type: array
          description: Every source of the terms, none missing and none repeated.
          items:
            type: string
        accepted_data_policy:
          type: boolean
          description: Must be true.
        channel:
          type: string
          enum: [embedded]
        partner_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
        application_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
    ConsentReceipt:
      type: object
      required: [consent_id, customer_id, terms_version, purpose, channel, scope, granted_at, expires_at]
      properties:
        consent_id:
          type: string
          example: cns-0f5c2b7a9d4e4c1c8a3b6e2d1f7a9b0c
        customer_id:
          type: string
        terms_version:
          type: string
        purpose:
          type: string
        channel:
          type: string
        scope:
          type: array
          items:
            $ref: "#/components/schemas/SourceTerm"
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    ConsentVerification:
      type: object
      required: [active, consent_id, granted_at, expires_at, sources]
      properties:
        active:
          type: boolean
        consent_id:
          type: string
          nullable: true
        granted_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        sources:
          type: array
          description: The sources covered at this moment.
          items:
            type: string
    ConsentEvidence:
      type: object
      required:
        - consent_id
        - customer_id
        - holder
        - terms_version
        - scope
        - purpose
        - channel
        - partner_id
        - application_id
        - user_agent
        - granted_at
        - expires_at
      properties:
        consent_id:
          type: string
        customer_id:
          type: string
        holder:
          type: object
          required: [document_id, full_name]
          properties:
            document_id:
              type: string
            full_name:
              type: string
        terms_version:
          type: string
        scope:
          type: array
          items:
            $ref: "#/components/schemas/SourceTerm"
        purpose:
          type: string
        channel:
          type: string
        partner_id:
          type: string
        application_id:
          type: string
        user_agent:
          type: string
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    Entity:
      type: object
      description: The financial entity the consent authorizes (the partner it was granted through).
      required: [code, name]
      properties:
        code:
          type: string
          example: aliado-banco-1
        name:
          type: string
          description: Display name from PARTNER_DISPLAY_NAMES; the code when it has none.
          example: Banco Aliado
    HolderConsentHistoryEntry:
      type: object
      required: [status, occurred_at, receipt_id, channel, entity_code]
      properties:
        status:
          type: string
          description: >
            granted and expired are synthetic (granted_at, expires_at);
            revocation_requested and revoked (of the whole consent) and
            revocation_confirmed, revocation_not_confirmed and
            revocation_retry_requested (of one entity, entity_code set) come
            from HU-M1.3-02.
          example: granted
        occurred_at:
          type: string
          format: date-time
        receipt_id:
          type: string
          nullable: true
        channel:
          type: string
          nullable: true
        entity_code:
          type: string
          nullable: true
          description: Null for a change of the whole consent.
    HolderConsent:
      type: object
      required:
        - consent_id
        - status
        - current
        - entities
        - purpose
        - channel
        - terms_version
        - scope
        - granted_at
        - expires_at
        - ended_at
        - revocation_receipt_id
        - revocable
        - revocation
        - history
      properties:
        consent_id:
          type: string
        status:
          type: string
          enum: [active, expired, revoked, revocation_pending, partially_revoked]
          description: >
            Derived from the record and its append-only events. Only active is
            current. revoked takes effect when the revocation is recorded;
            partially_revoked is a revoked consent that some entity did not
            confirm within its window (HU-M1.3-02, decision D-1 a).
            revocation_pending is reserved and not used by the server.
        current:
          type: boolean
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        purpose:
          type: string
        channel:
          type: string
        terms_version:
          type: string
        scope:
          type: array
          items:
            $ref: "#/components/schemas/SourceTerm"
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: When it stopped covering the holder; null while current.
        revocation_receipt_id:
          type: string
          nullable: true
        revocable:
          type: boolean
          description: Only an active consent can be revoked (HU-M1.3-02 CA-6).
        revocation:
          allOf:
            - $ref: "#/components/schemas/Revocation"
          nullable: true
          description: The revocation that ended the consent; null when it was not revoked.
        history:
          type: array
          items:
            $ref: "#/components/schemas/HolderConsentHistoryEntry"
    RevokeConsentRequest:
      type: object
      required: [requested_at, device, confirmation_method]
      properties:
        requested_at:
          type: string
          format: date-time
          description: >
            When the holder confirmed it on the device; at most 2 minutes in
            the future and never before the consent was granted.
        device:
          type: string
          minLength: 1
          maxLength: 120
          example: Google Pixel 8
        confirmation_method:
          type: string
          enum: [biometric, password]
    RevocationEntity:
      type: object
      required: [code, name, status, confirmed_at, deadline_at]
      properties:
        code:
          type: string
          example: aliado-banco-1
        name:
          type: string
          example: Banco Aliado
        status:
          type: string
          enum: [pending, confirmed, not_confirmed]
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        deadline_at:
          type: string
          format: date-time
          nullable: true
          description: End of the window of the entity to confirm (effective_at plus 5 minutes, or a retry's).
    Revocation:
      type: object
      required: [consent_id, receipt_number, status, requested_at, effective_at, channel, device, notice_status, entities]
      properties:
        consent_id:
          type: string
        receipt_number:
          type: string
          pattern: "^REV-[0-9]{4}-[0-9]{4,}$"
          example: REV-2026-0088
        status:
          type: string
          enum: [revoked, partially_revoked]
        requested_at:
          type: string
          format: date-time
        effective_at:
          type: string
          format: date-time
          description: When the authorization ended; the consent is not verified as active from then.
        channel:
          type: string
          example: mobile_app
        device:
          type: string
          nullable: true
        notice_status:
          type: string
          enum: [in_progress, completed, partial]
        entities:
          type: array
          items:
            $ref: "#/components/schemas/RevocationEntity"
    ComplianceRevokeRequest:
      type: object
      required: [reason, reference, role_confirmed]
      properties:
        reason:
          type: string
          enum: [customer_request, regulatory_order]
          description: customer_request is the request of the customer; regulatory_order a regulatory order.
        reference:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[A-Za-z0-9 ./#_-]+$"
          description: >
            Number of the ticket or order that supports the revocation, 3 to 64
            characters once repeated spaces are collapsed; letters, digits,
            space and - _ . / #.
          example: TCK-2026-0412
        role_confirmed:
          type: boolean
          description: The box of the modal in which the analyst confirms acting with the compliance role; it must be true.
    ComplianceRevocationEntity:
      type: object
      required: [code, name, status, confirmed_at, deadline_at]
      properties:
        code:
          type: string
          example: aliado-banco-1
        name:
          type: string
          example: Banco Aliado
        status:
          type: string
          enum: [pending, confirmed, not_confirmed]
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        deadline_at:
          type: string
          format: date-time
          nullable: true
          description: >
            End of the window of the entity to confirm. For a not_confirmed
            entity it is the time its window ran out.
    ComplianceActor:
      type: object
      description: >
        Who requested the revocation, a type and the sub of the account, never
        a name.
      required: [type, id]
      properties:
        type:
          type: string
          example: operations
        id:
          type: string
    ComplianceRevocation:
      type: object
      required:
        - receipt_number
        - requested_at
        - effective_at
        - channel
        - notice_status
        - requested_by
        - reason
        - reference
        - entities
      properties:
        receipt_number:
          type: string
          pattern: "^REV-[0-9]{4}-[0-9]{4,}$"
          example: REV-2026-0089
        requested_at:
          type: string
          format: date-time
        effective_at:
          type: string
          format: date-time
          description: When the authorization ended; the consent is not verified as active from then.
        channel:
          type: string
          description: compliance_portal when the portal revoked it, mobile_app when the holder did.
          example: compliance_portal
        notice_status:
          type: string
          enum: [in_progress, completed, partial]
        requested_by:
          $ref: "#/components/schemas/ComplianceActor"
        reason:
          type: string
          nullable: true
          description: Null when the holder revoked it from the app.
        reference:
          type: string
          nullable: true
          description: Null when the holder revoked it from the app.
        entities:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceRevocationEntity"
    ComplianceHistoryEntry:
      type: object
      required: [status, occurred_at, entity_code, actor_type, reason, reference]
      properties:
        status:
          type: string
          description: >
            granted and expired are synthetic; revocation_requested and revoked
            (of the whole consent) and revocation_confirmed,
            revocation_not_confirmed and revocation_retry_requested (of one
            entity, entity_code set) come from HU-M1.3-02.
          example: revoked
        occurred_at:
          type: string
          format: date-time
        entity_code:
          type: string
          nullable: true
        actor_type:
          type: string
          nullable: true
          description: holder, operations or system; null for the synthetic entries.
        reason:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
    ComplianceRevocationState:
      type: object
      required: [consent_id, status, revocable, holder, scope, entities, revocation, history]
      properties:
        consent_id:
          type: string
        status:
          type: string
          enum: [active, expired, revoked, partially_revoked]
        revocable:
          type: boolean
          description: Only an active consent can be revoked; the portal hides the action otherwise (CA-4).
        holder:
          type: object
          required: [full_name, document_masked]
          properties:
            full_name:
              type: string
            document_masked:
              type: string
              description: Only the last 4 characters are visible; the full document is only in the evidence.
              example: "******4050"
        scope:
          type: array
          items:
            $ref: "#/components/schemas/SourceTerm"
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        revocation:
          allOf:
            - $ref: "#/components/schemas/ComplianceRevocation"
          nullable: true
          description: The revocation that ended the consent; null when it was not revoked.
        history:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceHistoryEntry"
    ComplianceRetryResult:
      type: object
      required: [retried_entities, state]
      properties:
        retried_entities:
          type: array
          items:
            type: string
          description: Codes of the entities notified again.
        state:
          $ref: "#/components/schemas/ComplianceRevocationState"
    HolderConsentList:
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HolderConsent"
        generated_at:
          type: string
          format: date-time
    DecisionRecord:
      type: object
      required: [offer_id, customer_id, partner_id, application_id, channel, requested_at, rater_version, sources, profile, rules, premium, currency, decision]
      properties:
        offer_id: {type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
        customer_id: {type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
        partner_id: {type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
        application_id: {type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
        consent_id: {type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]*$", description: The consent the sources were consulted under}
        channel: {type: string, pattern: "^[A-Za-z0-9_.:-]{1,64}$"}
        requested_at: {type: string, format: date-time, description: When the underwriting request was made (UTC)}
        rater_version: {type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
        sources:
          type: array
          maxItems: 20
          items:
            type: object
            required: [source, status, latency_ms]
            properties:
              source: {type: string, pattern: "^[A-Za-z0-9_.:-]{1,64}$"}
              status: {type: string, pattern: "^[A-Za-z0-9_.:-]{1,64}$", description: "ok, timeout, error or circuit_open"}
              latency_ms: {type: integer, format: int64, minimum: 0, maximum: 3600000}
              consulted_at: {type: string, format: date-time, nullable: true, description: When the call to the source started (UTC)}
              score: {type: number, minimum: 0, maximum: 1, nullable: true, description: The risk score the source returned; null when it did not answer}
              category: {type: string, maxLength: 64, pattern: "^[A-Za-z0-9_.:-]*$", description: The category the source returned; empty when it did not answer}
        profile:
          type: object
          required: [score, category, partial]
          properties:
            score: {type: number, minimum: 0, maximum: 1}
            category: {type: string, maxLength: 64, pattern: "^[A-Za-z0-9_.:-]*$"}
            partial: {type: boolean}
        rules:
          type: array
          minItems: 1
          maxItems: 50
          description: Rating rules in execution order
          items:
            type: object
            required: [order, code, value]
            properties:
              order: {type: integer, minimum: 1, maximum: 1000}
              code: {type: string, pattern: "^[A-Za-z0-9_.:-]{1,64}$"}
              value: {type: number}
        premium: {type: number, minimum: 0, maximum: 1000000000000}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        decision: {type: string, enum: [accepted, rejected, deferred]}
        decision_reason: {type: string, maxLength: 64, pattern: "^[A-Za-z0-9_.:-]*$", description: Required unless the decision is accepted}
        recorded_at: {type: string, format: date-time, readOnly: true, description: Set by the server}
