# Contract test of the claims routes (OBJ 05): the real service with its own
# PostgreSQL, the policy core stub (HU-W2.1-01), the payment gateway and
# e-mail stubs of the decision (HU-W2.2-03) and Moto as the Cognito of the
# human routes, checked against api/openapi.yaml by Schemathesis. Run it with
# ./run.sh. Build context is the repository root. Published ports (127.0.0.1
# only): claims 8296, Moto 5122.
name: claims-contract

services:
  postgres-claims:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=claims
      - POSTGRES_USER=claims
      - POSTGRES_PASSWORD=${PG_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims"]
      interval: 2s
      timeout: 2s
      retries: 30

  policy-core:
    build:
      context: ../../../..
      dockerfile: stubs/policy-core/Dockerfile
    environment:
      - PORT=9060

  # HU-W2.2-03: the approval pays through the gateway and the rejection is
  # notified by e-mail.
  payment-gateway:
    build:
      context: ../../../..
      dockerfile: stubs/payment-gateway/Dockerfile
    environment:
      - PORT=9040

  email:
    build:
      context: ../../../..
      dockerfile: stubs/email/Dockerfile
    environment:
      - PORT=9030

  moto:
    image: motoserver/moto:5.2.3
    ports:
      - "127.0.0.1:${MOTO_PORT:-5122}:5000"
    environment:
      - MOTO_COGNITO_IDP_USER_POOL_ID_STRATEGY=HASH
      - MOTO_COGNITO_IDP_USER_POOL_CLIENT_ID_STRATEGY=HASH
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      timeout: 2s
      retries: 15

  claims:
    build:
      context: ../../../..
      dockerfile: services/claims/Dockerfile
    ports:
      - "127.0.0.1:${CLAIMS_PORT:-8296}:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://claims:${PG_PASSWORD:-}@postgres-claims:5432/claims?sslmode=disable
      - POLICY_CORE_URL=http://policy-core:9060
      - PAYMENT_GATEWAY_URL=http://payment-gateway:9040
      - EMAIL_URL=http://email:9030
      # Object store of the supports and the evidence: the S3 of Moto, whose
      # bucket run.sh creates before claims starts. The credentials are the
      # dummy ones of the emulator.
      - EVIDENCE_BUCKET=claims-evidence
      - EVIDENCE_ENDPOINT_URL=http://moto:5000
      - AWS_REGION=us-east-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      # Cognito of Moto, written by run.sh after seeding it.
      - AUTH_ISSUER=${AUTH_ISSUER:-}
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-}
      - AUTH_CLIENT_IDS=${AUTH_CLIENT_IDS:-}
    depends_on:
      postgres-claims:
        condition: service_healthy
      moto:
        condition: service_healthy
      policy-core:
        condition: service_started
      payment-gateway:
        condition: service_started
      email:
        condition: service_started

  # Started on demand by run.sh (docker compose run --rm schemathesis ...).
  schemathesis:
    image: schemathesis/schemathesis:v3.39.16
    profiles: ["tools"]
    volumes:
      - ../../api:/api:ro
