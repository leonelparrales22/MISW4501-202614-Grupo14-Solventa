openapi: 3.0.3
info:
  title: Solventa - claims service
  version: 0.14.0
  description: >-
    0.14.0 (HU-M2.4-01): the claims the parametric engine resolves by itself.
    The list, the detail and the history of a claim gain
    automatic_resolution (null for a claim evaluated by an analyst): when it
    was resolved, the rules applied and the trigger (the parameter, its
    threshold and the value observed that made it pay). Such a claim has
    channel parametric, incident_type flight_delay, the line travel in its
    policy and no requirements; its history goes in_evaluation, approved and
    paid. The engine consumes ParametricTriggerObserved and publishes
    ParametricPayoutCompleted (docs/events/README.md); no route is added.
    Compatible with 0.13.0 (it only adds a field and enum values of reads).
    0.13.0 (HU-W2.1-04): POST /v1/claims/{claim_id}/resubmission is the
    insured correcting a returned filing and sending it again: the facts that
    change, the supports added or replaced (a group is the whole set of files
    the requirement keeps), and review_seq, the return it answers. The claim
    keeps its id and filing number, becomes active for a new review of the
    advisor and the resubmission is recorded (who, when, what changed); the
    history lists the resubmissions. Every support the advisor found illegible
    must be replaced and every one missing uploaded, besides the required ones
    of the claim type: otherwise 422 with every field still missing. Filings of
    the phone too: photographs of the vehicle uploaded then replace the ones of
    the phone.
    0.12.0 (HU-W2.2-02): GET /v1/claims/evaluations is the queue of
    operations ordered by priority (Triage 1, 2 and 3, then the claims without
    a level, and in each the one filed first), filtered by level, line and
    status, with the insured of each claim and a summary: the claims by level,
    how many match and the mean time of resolution of the last 30 days.
    0.11.0 (HU-W2.3-01): the assignment of the nearest provider (assessor or
    workshop) to a claim in evaluation that needs an on-site visit. The
    claim's location comes from the most precise trusted evidence of the
    phone; without it, operations records the address and the coordinates of
    the pin (POST /v1/claims/{claim_id}/incident-location). POST
    /v1/claims/{claim_id}/provider-searches looks for available providers
    with the specialty of the claim type, widening the radius 5, 10 and 20 km
    and recording every attempt, and suggests the nearest; with none within
    the maximum radius the claim is pending assignment, with its reason, and
    the search is repeated on its own. POST /v1/claims/{claim_id}/assignment
    confirms a provider, which receives the location by e-mail. GET
    /v1/claims/{claim_id}/assignment reads it all, GET /v1/claims/assignments
    the state of a page of claims and GET /v1/claims/assignment-policy the
    radii and the specialty of each claim type. The registry of providers is
    administered by operations under /v1/claims/providers. The status of the
    claim does not change. Only operations.
    0.10.0 (HU-W2.1-03): the advisor reviews every filing before it enters
    evaluation, with a verdict on each support (valid, illegible or missing). A filed claim is active (waiting for review) and is not
    triaged nor listed for operations until the advisor approves it (POST
    /v1/claims/{claim_id}/review-approval), which makes it in_evaluation; or
    returns it with the reason and what is missing (POST
    /v1/claims/{claim_id}/review-return), which makes it returned. GET
    /v1/claims/reviews lists the filings to review and GET
    /v1/claims/{claim_id}/review the detail. GET /v1/claims/{claim_id}/history
    reads every change of status of a claim, recorded by the database as it
    happens. The status gains returned.
    0.9.0 (HU-M2.2-01): the filing from the phone (POST /v1/claims) takes the
    optional estimated_amount_minor with the rules of the web filing, and its
    answer returns it when it was declared; it counts in the fingerprint of
    the filing only then. 0.8.0 (HU-W2.2-03): the decision of operations on a claim. POST
    /v1/claims/{claim_id}/approval approves it for an amount bounded by the
    insured value of its coverage and pays the amount less the deductible to
    the account of the insured, once per approval; POST
    /v1/claims/{claim_id}/rejection rejects it with a reason the insured
    receives by e-mail; a payout that fails leaves the claim in
    payment_exception, listed by GET /v1/claims/payment-exceptions, and POST
    /v1/claims/{claim_id}/payout-retry retries it with the same key. The
    detail of the evaluation carries the decision, and a claim reaches the
    statuses approved, paid, rejected and payment_exception. 0.7.0
    (HU-W2.2-03): the claims in evaluation and the detail operations decides
    with. 0.6.0 (HU-W2.2-01): the automatic priority of the claim (triage). Every
    claim that enters evaluation gets a level (Triage 1, 2 or 3) from the
    severity of its claim type and the band of its estimated amount, within 60
    seconds and with no manual step, and it is recalculated when that
    information changes. GET /v1/claims/{claim_id}/triage reads it (operations:
    the full view with its history; the insured who filed the claim: the level
    and the estimated resolution time), GET /v1/claims/triage reads the levels
    of a page of claims at once (operations) and GET /v1/claims/triage-policy
    the severity table, the amount thresholds and the target of each level
    (operations). The web filing gains the optional estimated_amount_minor,
    which the detail of a claim returns. 0.5.0 (HU-W2.1-01): the supports of the web filing no longer go through
    the service. POST /v1/claims/supports declares one file (name, type,
    size, sha256) and returns the signed URL with which the browser uploads
    it straight to the object store; POST
    /v1/claims/supports/{support_id}/confirmation checks what arrived (size,
    digest and the first bytes of the file) and only a confirmed support can be
    attached to a claim. The detail of a claim now lists the evidence of the
    phone, with a signed read of each file. 0.4.0 (HU-M2.1-01): the evidence of the claim. POST
    /v1/claims/evidence/upload-url issues the signed URL with which the phone
    uploads a photograph or a video straight to the evidence bucket, and the
    mobile filing of POST /v1/claims carries the evidence array, which is now
    required: between 4 and 6 photographs and up to one video. The filing
    checks every key against the store, so a key that is not there answers 422
    with the field code not_stored, and the answer counts what ended up with
    the case. 0.3.0 (HU-W2.1-01): filing of the claim with supports from the web portal
    (filing options, supports, web filing), the insured's list of
    claims, the detail of a claim and the filing receipt in PDF. 0.2.0
    (HU-M2.2-01): filing of the claim from the guided assistant of the mobile
    app.
paths:
  /health:
    get:
      summary: Shallow health check (ALB, ADR-02)
      responses:
        "200":
          description: OK
  /v1/claims:
    post:
      summary: File a claim (HU-M2.2-01)
      description: >-
        Creates the case with its filing number. The case belongs to the
        subject of the token. The filing is identified by Idempotency-Key:
        repeating the call with the same key and the same body answers 200
        with the case that already exists.
      security:
        - cognitoJwt: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Identifier of the filing; the mobile app sends its draft id.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{1,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilingRequest"
      responses:
        "201":
          description: The case was created
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "200":
          description: The same filing key had already created this case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          description: invalid_request - the body is not valid JSON, or the key is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of an insured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: validation_failed or idempotency_key_reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "503":
          description: filing_unavailable - retry with the same key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List the insured's own claims (HU-W2.1-01)
      description: >-
        The claims filed by the subject of the token, from both channels
        (mobile and web), newest first. A claim filed from the mobile app has
        no policy snapshot, so its policy line, product and insured object are
        null.
        HA-L02: the read waits 900 ms for the database; when it does not
        answer in time, the last read kept in the read cache answers, with
        stale true and as_of the time it was read.
      security:
        - cognitoJwt: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, returned, in_evaluation, approved, paid, rejected, payment_exception]
        - name: policy_id
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z0-9-]{3,40}$'
        - name: from
          in: query
          required: false
          description: >-
            Only the claims filed on or after this day, from 00:00 in
            America/Bogota.
          schema:
            type: string
            format: date
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: page_token
          in: query
          required: false
          description: The next_page_token of the previous page, unchanged.
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: One page of the insured's claims
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            X-Stale:
              $ref: "#/components/headers/XStale"
            X-Data-Source:
              $ref: "#/components/headers/XDataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimList"
        "400":
          description: invalid_request - a filter or the page token is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of an insured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/evidence/upload-url:
    post:
      summary: Sign the upload of one evidence (HU-M2.1-01)
      description: >-
        Issues the URL with which the client uploads one evidence. The file
        never passes through this service: it goes from the phone to the
        evidence bucket, which is what lets a video of 30 seconds fit. The
        signature fixes the media type, the size and the SHA-256 digest, and
        the key is derived from the subject of the token and the digest, so
        one insured cannot write in the directory of another. Asking twice for
        the same file answers the same key.
      security:
        - cognitoJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "201":
          description: The signed upload
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedUpload"
        "400":
          description: invalid_request - the body is not valid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of an insured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: validation_failed - the declaration breaks its rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "503":
          description: evidence_unavailable - the upload could not be prepared; retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/filing-options:
    get:
      summary: Policies the insured can file a claim on, with the supports of each type (HU-W2.1-01)
      description: >-
        Only the insured's policies that are active now and whose line has
        claim types that are filed (auto and home; travel is parametric and is
        not filed). For each policy, the claim types it covers and, for each
        type, the supports of the catalog with the required ones marked
        (criterion 1). Mounted only when the policy core is configured
        (POLICY_CORE_URL).
      security:
        - cognitoJwt: []
      responses:
        "200":
          description: The filing options of the insured
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilingOptions"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of an insured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: policy_directory_unavailable - the policy core did not answer; retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/supports:
    post:
      summary: Declare one support of a claim and get its signed upload (HU-W2.1-01)
      description: >-
        Declares a file before the filing references it by its support_id. The
        service checks the declaration (type JPG, PNG or PDF, of 1 byte to 10
        MiB = 10485760 bytes, and its sha256) and returns a signed URL: the
        browser uploads the file there with a PUT carrying exactly the
        upload_headers, and then confirms it with
        /v1/claims/supports/{support_id}/confirmation. The file never crosses
        this service nor the API Gateway, so the 10 MB payload limit of the
        gateway does not apply to it. A rejected file does not affect the
        supports already declared (criterion 5). The support belongs to the
        subject of the token and can be attached to one claim only. Mounted only
        when the policy core (POLICY_CORE_URL) and the object store
        (EVIDENCE_BUCKET) are configured.
      security:
        - cognitoJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportDeclaration"
      responses:
        "201":
          description: The support was declared; upload the file to upload_url
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportUpload"
        "400":
          description: invalid_request - the body is not valid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of an insured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: file_too_large - the declared size is larger than 10 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: unsupported_file_type - the declared type is not JPG, PNG or PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: empty_file (the declared size is not positive) or validation_failed (the sha256)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"
        "429":
          description: >-
            too_many_pending_supports - the insured already has 50 supports
            not attached to any claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: supports_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/supports/{support_id}/confirmation:
    post:
      summary: Confirm that the file of a support was uploaded (HU-W2.1-01)
      description: >-
        Checks the object that the browser uploaded against the declaration: it
        is in the store, has the declared size and digest, and its first bytes
        are the declared format. The type is told by the content, never by the
        extension or the declared Content-Type: a renamed executable is
        refused (415). Confirming twice is harmless. Until it is confirmed the
        support cannot be attached to a claim (the filing answers not_found).
        A support of another insured answers 404, the same as one that does
        not exist.
      security:
        - cognitoJwt: []
      parameters:
        - name: support_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^sup-[0-9a-f]{32}$'
      responses:
        "200":
          description: The upload matches its declaration
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmedSupport"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of an insured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: support_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: unsupported_file_type - the content is not the JPG, PNG or PDF that was declared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            support_not_uploaded (the file is not in the store yet; upload it
            and confirm again) or support_mismatch (its size or digest are not
            the declared ones)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: supports_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/web-filings:
    post:
      summary: File a claim with its supports from the web portal (HU-W2.1-01)
      description: >-
        Creates the case in status active with its filing number, attached to
        the supports already uploaded and confirmed (criterion 4). The form is checked first
        and every missing or invalid field and support is reported at once
        (criterion 2); then the policy is looked up among the insured's own:
        it must be active, cover the claim type and the incident must have
        happened within its validity (criterion 3). A policy of another insured
        answers as one that does not exist. The filing is identified by
        Idempotency-Key, as in POST /v1/claims: the same key and the same body
        answer 200 with the case that already exists. Mounted only when the
        policy core is configured (POLICY_CORE_URL).
      security:
        - cognitoJwt: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Identifier of the filing; the web portal sends a new UUID per form.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{1,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebFilingRequest"
      responses:
        "201":
          description: The case was created
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
        "200":
          description: The same filing key had already created this case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
        "400":
          description: invalid_request - the body is not valid JSON, or the key is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of an insured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            validation_failed or idempotency_key_reused (WebValidationError),
            or policy_not_eligible (PolicyNotEligible)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebValidationError"
                  - $ref: "#/components/schemas/PolicyNotEligible"
        "503":
          description: >-
            policy_directory_unavailable (the policy core did not answer; no
            case was created) or filing_unavailable - retry with the same key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/triage:
    get:
      summary: Triage of a page of claims at once (HU-W2.2-01)
      description: >-
        The level, severity, amount band and target of each claim asked for,
        in the order asked, so the queue of the analyst shows the priority of a
        whole page of claims with one call. A claim that does not exist comes
        back with state not_found instead of failing the call. Only operations.
      security:
        - cognitoJwt: []
      parameters:
        - name: claim_id
          in: query
          required: true
          description: Ids of the claims, repeated (claim_id=a&claim_id=b), 1 to 50, without repeats.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            uniqueItems: true
            items:
              type: string
              pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        "200":
          description: The triage of each claim, in the order asked
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimTriageList"
        "400":
          description: >-
            invalid_request - no claim_id, more than 50, a repeated one or one
            that is not a claim id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/triage-policy:
    get:
      summary: The triage policy in force (HU-W2.2-01)
      description: >-
        The severity of each claim type, the amount thresholds and the target of
        each level, for the indicators of the queue ("Triage 2 · target: 5
        business days"). The policy is provisional until the business validates
        it; its version changes when it does. Only operations.
      security:
        - cognitoJwt: []
      responses:
        "200":
          description: The policy in force
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriagePolicy"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/assignments:
    get:
      summary: Provider assignment of a page of claims at once (HU-W2.3-01)
      description: >-
        The state of the assignment of each claim asked for, in the order
        asked, so a list of claims shows which ones are pending assignment or
        already assigned with one call. A claim that does not exist comes back
        with state not_found instead of failing the call. Only operations.
      security:
        - cognitoJwt: []
      parameters:
        - name: claim_id
          in: query
          required: true
          description: Ids of the claims, repeated (claim_id=a&claim_id=b), 1 to 50, without repeats.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            uniqueItems: true
            items:
              type: string
              pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        "200":
          description: The assignment of each claim, in the order asked
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
