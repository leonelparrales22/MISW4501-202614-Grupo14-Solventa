  /v1/claims/evaluations:
    get:
      summary: The queue of operations ordered by priority (HU-W2.2-02)
      description: >-
        The claims waiting for the decision of operations (in_evaluation:
        approved by the advisor, HU-W2.1-03), ordered by priority: Triage 1,
        then 2, then 3, then the ones the triage has not assessed yet, and in
        each the one filed first. A new level moves the claim in the next
        read. Each claim carries its estimated amount, its priority and the
        insured as the policy core describes them (null when the core does not
        answer). The summary counts the whole queue by level, how many claims
        match the filters and the mean time from the filing to the decision of
        the claims decided in the last 30 days (null when none was). A claim
        waiting for the review of the advisor or returned to the insured is
        not here. Only operations.
      security:
        - cognitoJwt: []
      parameters:
        - name: page_size
          in: query
          required: false
          description: Claims per page, 1 to 50; 20 when absent.
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: page_token
          in: query
          required: false
          description: The next_page_token of the previous page; opaque.
          schema:
            type: string
            maxLength: 512
        - name: level
          in: query
          required: false
          description: Only the claims of a level of the triage, or none for the ones without a level yet.
          schema:
            type: string
            enum: ["1", "2", "3", none]
        - name: line
          in: query
          required: false
          description: Only the claims of a line, by their claim type.
          schema:
            $ref: "#/components/schemas/PolicyLine"
        - name: status
          in: query
          required: false
          description: Only the claims of one status of the queue.
          schema:
            type: string
            enum: [in_evaluation]
      responses:
        "200":
          description: One page of the queue by priority and its summary
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriorityQueue"
        "400":
          description: invalid_request - page_size out of 1 to 50, a filter or a page token that is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/payment-exceptions:
    get:
      summary: Payment exceptions (HU-W2.2-03)
      description: >-
        The approved claims whose payout failed - the gateway rejected it or
