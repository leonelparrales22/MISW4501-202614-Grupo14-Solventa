                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}/review-approval:
    post:
      summary: Approve a filing, which enters evaluation (HU-W2.1-03)
      description: >-
        The advisor approves a filing waiting for review: every attached
        support is valid. The claim becomes in_evaluation, the triage gives it
        a level within 60 seconds and it enters the queue of operations. A
        filing with a required support missing is not approved (422
        supports_incomplete): it is returned. Only the advisor, and only once
        per filing: a second approval, or one of a filing already returned,
        answers 409.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      responses:
        "200":
          description: Approved; the claim is in evaluation
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewOutcome"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of an advisor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: claim_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: claim_not_reviewable - the claim is not waiting for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: supports_incomplete - a required support is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}/review-return:
    post:
      summary: Return a filing to the insured with what is missing (HU-W2.1-03)
      description: >-
        The advisor returns a filing waiting for review with the reason (from
        a list), the message the insured reads, the verdict on the supports
        that do not serve (illegible, or missing to ask for an optional one)
        and the facts to correct; at least one support illegible or missing or
        one fact. The answer carries the verdict on every support (screen A9).
        The claim becomes returned and keeps its filing number; the insured
        corrects it and sends it again (HU-W2.1-04), which makes it active again
        for a new review. Only the advisor.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnRequest"
      responses:
        "200":
          description: Returned to the insured
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewOutcome"
        "400":
          description: invalid_request - the body does not follow the schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of an advisor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: claim_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: claim_not_reviewable - the claim is not waiting for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            message_required (only blanks), message_too_long, note_too_long,
            nothing_requested (no support illegible or missing and no fact),
            support_not_applicable (a code that is not a support of the claim
            type) or verdict_not_applicable (an attached support marked missing,
            or one that is not attached marked valid or illegible)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}/history:
    get:
      summary: Every status the claim went through (HU-W2.1-03)
      description: >-
        The changes of status of the claim, oldest first, each with when it
        happened, and the date of the last one. The database records them as
        the status changes, whoever changes it, so every stage of the case is
        here: filed, returned, sent again, in evaluation, decided and paid.
        When the claim is returned, last_return says why and what is missing,
        and requirements the rules of the supports to upload (HU-W2.1-04);
        resubmissions are the times it was sent again.
        The insured reads only their own claims (another one answers 404, as if
        it did not exist); the advisor and operations read any. It is the
        source of the timeline of the case (HU-W2.1-02, HU-M2.4-01) and of the
        notice of a change of stage (HU-M3.3-01).
        HA-L02: the read waits 900 ms for the database; when it does not
        answer in time, the last read kept in the read cache answers, with
        stale true and as_of the time it was read.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      responses:
        "200":
          description: The history of the claim
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            X-Stale:
              $ref: "#/components/headers/XStale"
            X-Data-Source:
              $ref: "#/components/headers/XDataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimHistory"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of an insured, an advisor or operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: claim_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}/resubmission:
    post:
      summary: Correct a returned filing and send it again (HU-W2.1-04)
      description: >-
        The insured who filed the claim corrects it while it is returned
        (screen A9): the facts that change (occurred_at, place, description,
        estimated_amount_minor; one that is not sent is kept) and the supports.
        A support group is the whole set of files the requirement keeps after
        the correction: the ids of the claim it keeps and the new ones
        uploaded (POST /v1/claims/supports); a requirement that is not sent
        keeps its files. review_seq is the review that returned the claim
        (last_return.seq of the history). Everything is checked as the advisor
        will review it: the facts with the rules of the filing (the time of the
        incident within the validity of the policy copied at the filing), every
        required support of the claim type with its files, every support the
        advisor found illegible replaced with a new file (not_replaced) and
        every one missing uploaded (missing). The claim keeps its id and filing
        number and becomes active for a new review; the resubmission is
        recorded with who, when and what changed, and the replaced files stop
        being shown. A retry of a resubmission that went through answers 200
        with the same one and the claim as it is now. Only the insured who
        filed the claim; another insured's answers 404.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResubmissionRequest"
      responses:
        "200":
          description: Sent again; the claim is active for a new review
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResubmissionOutcome"
        "400":
          description: invalid_request - the body does not follow the schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of an insured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: claim_not_found - it does not exist or it is another insured's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            claim_not_returned (it is not returned: never was, or it was sent
            already) or stale_return (review_seq is not the last return: read
            the history and correct the last one)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: validation_failed - every field and support still missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResubmissionValidationError"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}:
    get:
      summary: Detail of one of the insured's claims (HU-W2.1-01)
      description: >-
        What the confirmation of the filing shows: number, status, policy,
        incident and supports. Only the insured who filed the claim reads it.
        HA-L02: the read waits 900 ms for the database; when it does not
        answer in time, the last read kept in the read cache answers, with
        stale true and as_of the time it was read.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      responses:
        "200":
          description: The claim
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            X-Stale:
              $ref: "#/components/headers/XStale"
            X-Data-Source:
              $ref: "#/components/headers/XDataSource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - not an insured, or the claim belongs to another insured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: claim_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}/approval:
    post:
      summary: Approve a claim and pay its indemnity (HU-W2.2-03)
      description: >-
        The analyst approves a claim in evaluation for gross_amount_minor, the
        cost of the repair before the deductible,
        which cannot exceed the insured value of the coverage of its incident as
        the policy core describes it now. The indemnity is that amount less the
        deductible, and it is paid at once to the account the policy core has for
        the insured, through the payment gateway under one idempotency key per
        approval (HA-D02): one approval is exactly one disbursement. The answer
        is 202 with the payout pending; the detail of the evaluation shows when
        it is paid, or when it becomes a payment exception. Only operations.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "202":
          description: Approved; the payout is in course
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDecision"
        "400":
          description: "invalid_request - the body does not follow the schema"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "forbidden - the token is not of operations"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "claim_not_found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "claim_not_decidable - the claim is not in evaluation: it was already decided"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "amount_exceeds_insured_value, nothing_to_pay (the deductible takes it all), not_covered or no_payout_account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "policy_unavailable (the terms of the policy could not be read) or claims_unavailable - retry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}/rejection:
    post:
      summary: Reject a claim with its reason (HU-W2.2-03)
      description: >-
        The analyst rejects a claim in evaluation with a reason, which is
        required. The claim becomes rejected and the insured is told by e-mail,
        with the reason, at the contact the policy core has for them; the
        detail of the evaluation shows when the notice was sent. Only
        operations.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionRequest"
      responses:
        "200":
          description: Rejected
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDecision"
        "400":
          description: "invalid_request - the body does not follow the schema"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "forbidden - the token is not of operations"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "claim_not_found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "claim_not_decidable - the claim is not in evaluation: it was already decided"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "reason_required (only blanks), reason_too_long, not_covered (the core does not know the insured) or no_contact"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "policy_unavailable (the insured could not be read) or claims_unavailable - retry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}/payout-retry:
    post:
      summary: Retry the payout of a payment exception (HU-W2.2-03)
      description: >-
        The analyst retries the payout of a claim in payment_exception, to the
        corrected destination when the body carries one, or to the same one
        when it does not. The idempotency key does not change, so a retry
        never pays twice. The claim goes back to approved and the automatic
        attempts start again. Only operations.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutRetryRequest"
      responses:
        "202":
          description: Retried; the payout is in course
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDecision"
        "400":
          description: "invalid_request - the body does not follow the schema"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "forbidden - the token is not of operations"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "claim_not_found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "payout_not_retryable - the claim is not a payment exception"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "claims_unavailable - retry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}/evaluation:
    get:
      summary: Everything operations decides a claim with (HU-W2.2-03)
      description: >-
        The claim with its supports and evidence (signed reads of 10 minutes),
        its priority, the policy as the policy core describes it today with the
        insured value and the deductible of each coverage, the coverage of the
        incident of the claim and the insured with the payout account masked.
        When the policy core does not answer the claim is still served with
        policy_unavailable true and policy, coverage and holder null. Only
        operations.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      responses:
        "200":
          description: The claim and what it is evaluated with
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimEvaluation"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: claim_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}/filing-receipt:
    get:
      summary: Filing receipt of one of the insured's claims, in PDF (HU-W2.1-01)
      description: >-
        The receipt the insured downloads after filing (criterion 4): filing
        number, status, date and time of the filing, policy, incident and
        supports. It is built from the stored case on every call.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      responses:
        "200":
          description: The receipt
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="radicado-SIN-2026-01712.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - not an insured, or the claim belongs to another insured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: claim_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}/triage:
    get:
      summary: Priority of one claim (HU-W2.2-01)
      description: >-
        The level the triage gave the claim. Operations reads the full view: the
        severity and the amount band that set the level, the target and every
        calculation with its causes. The insured who filed the claim reads the
        level and the estimated resolution time. Before the first calculation
        (at most 60 seconds after the claim enters evaluation) the state is
        pending; poll again in 5 seconds.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      responses:
        "200":
          description: The triage of the claim, in the view of the role of the token
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ClaimTriage"
                  - $ref: "#/components/schemas/ClaimTriageForInsured"
                discriminator:
                  propertyName: view
                  mapping:
                    operations: "#/components/schemas/ClaimTriage"
                    insured: "#/components/schemas/ClaimTriageForInsured"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            forbidden - neither operations nor an insured, or the claim belongs
            to another insured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: claim_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}/assignment:
    get:
      summary: Provider assignment of one claim (HU-W2.3-01)
      description: >-
        Everything the screen "Asignar prestador" shows: the state of the
        assignment, the specialty the claim type needs, the location of the
        incident, the last search with every attempt and its candidates, and
        the assignment once confirmed. A claim pending assignment shows the
        reason; the search is repeated on its own every retry_interval_seconds
        of the policy. Only operations.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      responses:
        "200":
          description: The assignment of the claim
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimAssignment"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: claim_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Confirm the provider of a claim (HU-W2.3-01)
      description: >-
        Assigns one of the eligible providers of the last search (the
        suggested one or another eligible). The claim records the provider,
        the date and time, the distance and the location shared; the provider
        becomes busy and receives the location by e-mail (notice.status tells
        whether it left). A provider out of the radius of the last attempt is
        not eligible: widen the radius first. Once per claim. Only operations.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentRequest"
      responses:
        "201":
          description: Assigned
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimAssignment"
        "400":
          description: invalid_request - the body is not a JSON object or has unknown fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: claim_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            assignment_exists - the claim already has its provider;
            provider_unavailable - the provider stopped being available after
            the search (search again); search_outdated - search_seq is not the
            last search of the claim, or the location changed after it;
            claim_not_assignable - the claim is not in evaluation or its type
            needs no on-site visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            provider_not_eligible - the provider is not among the eligible of
            the search (unavailable, without the specialty, out of the radius or
            unknown); validation_failed - a field is missing or malformed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/FieldValidationError"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}/incident-location:
    post:
      summary: Record the location of the incident (HU-W2.3-01)
      description: >-
        The alternative when the claim has no coordinates from the app: the
        address of the incident and the coordinates of the pin the analyst
        placed on the map. It can be corrected until the claim is assigned
        (the last one counts); every record keeps who made it and when. Only
        operations.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentLocationRequest"
      responses:
        "201":
          description: Recorded; the claim is ready to search
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimAssignment"
        "400":
          description: invalid_request - the body is not a JSON object or has unknown fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: claim_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            location_from_app - the claim has trusted coordinates from the app;
            assignment_exists - the claim already has its provider;
            claim_not_assignable - the claim is not in evaluation or its type
            needs no on-site visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: validation_failed - every invalid field at once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldValidationError"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/claims/{claim_id}/provider-searches:
    post:
      summary: Search the nearest provider (HU-W2.3-01)
      description: >-
        Looks for available providers with the specialty of the claim type,
        from from_radius_km (the initial radius when absent) widening through
        the radii of the policy until one has eligible providers, and records
        every attempt. found suggests the nearest eligible; exhausted leaves
        the claim pending assignment with its reason, and the search is
        repeated on its own. "Ampliar radio" is a search from the next radius;
        "Reintentar búsqueda", one without body. Only operations.
      security:
        - cognitoJwt: []
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderSearchRequest"
      responses:
        "201":
          description: Searched (last_search holds the result, found or exhausted)
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimAssignment"
        "400":
          description: invalid_request - the body is not a JSON object or has unknown fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - the token is not of operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: claim_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            assignment_exists - the claim already has its provider;
            claim_not_assignable - the claim is not in evaluation or its type
            needs no on-site visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            location_missing - the claim has no coordinates from the app and the
            analyst has not recorded the location; validation_failed -
            from_radius_km is not a radius of the policy
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/FieldValidationError"
        "503":
          description: claims_unavailable - retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  headers:
    XStale:
      description: HA-L02. true when the read came from the read cache.
      schema:
        type: string
        enum: ["true", "false"]
    XDataSource:
      description: HA-L02. Where the read came from.
      schema:
        type: string
        enum: [database, cache]
  parameters:
    ClaimID:
      name: claim_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        example: 8f14e45f-ceea-467a-9f3a-5a2d0b1c7e90
    ProviderID:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^prv-[a-z0-9-]{3,40}$'
        example: prv-servicios-hogar-norte
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ID token of the Cognito user pool (HA-S01).
  schemas:
    FilingRequest:
      type: object
      required: [policy_id, incident_type, occurred_at, place, description, evidence, declaration_accepted]
      properties:
        policy_id:
          type: string
          pattern: '^[A-Za-z0-9-]{3,40}$'
          example: AU-2025-118204
        incident_type:
          type: string
          enum: [collision, theft, third_party_damage, other]
        occurred_at:
          type: string
          format: date-time
          description: Not in the future, and no older than five years.
        place:
          type: string
          minLength: 3
          maxLength: 160
        description:
          type: string
          minLength: 10
          maxLength: 1000
        details:
          type: object
          description: >-
            Answers to the questions that depend on the incident type: up to
            20 keys of 1 to 40 characters, with values of up to 200.
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 200
        evidence:
          type: array
          description: >-
            What was captured at the place, already uploaded to the evidence
            bucket (HU-M2.1-01): between 4 and 6 photographs and up to one
            video. The video does not count towards the minimum.
          minItems: 4
          maxItems: 7
          items:
            $ref: "#/components/schemas/EvidenceItem"
        declaration_accepted:
          type: boolean
          description: The declaration under oath. It must be true.
        estimated_amount_minor:
          $ref: "#/components/schemas/EstimatedAmountMinor"
    Claim:
      type: object
      required: [claim_id, filing_number, status, policy_id, incident_type, occurred_at, filed_at]
      properties:
        claim_id:
          type: string
          example: 8f14e45f-ceea-467a-9f3a-5a2d0b1c7e90
        filing_number:
          type: string
          description: SIN-<year>-<five digits>, unique in the platform.
          example: SIN-2026-01877
        status:
          type: string
          enum: [active]
        policy_id:
          type: string
        incident_type:
          type: string
          enum: [collision, theft, third_party_damage, other]
        occurred_at:
          type: string
          format: date-time
        filed_at:
          type: string
          format: date-time
        evidence_count:
          $ref: "#/components/schemas/EvidenceCount"
        estimated_amount_minor:
          allOf:
            - $ref: "#/components/schemas/EstimatedAmountMinor"
          description: What the insured declared; absent when it was not.
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
    ValidationError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [validation_failed, idempotency_key_reused]
        message:
          type: string
        fields:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
                description: >-
                  not_stored is the key that is not in the evidence bucket, is
                  not the token subject's, or whose size or digest is not the
                  declared one (HU-M2.1-01).
                enum: [required, invalid_format, out_of_range, not_stored]
    UploadRequest:
      type: object
      required: [kind, content_type, byte_size, sha256]
      description: What the insured declares before uploading one evidence.
      properties:
        kind:
          $ref: "#/components/schemas/EvidenceKind"
        content_type:
          type: string
          description: image/jpeg for a photo, video/mp4 for a video.
          enum: [image/jpeg, video/mp4]
        byte_size:
          type: integer
          format: int64
          description: >-
            1 KiB to 2 MB in a photograph; 1 KiB to 60 MB in a video.
          minimum: 1024
          maximum: 60000000
        sha256:
          $ref: "#/components/schemas/SHA256"
    SignedUpload:
      type: object
      required: [object_key, upload_url, upload_headers, expires_at]
      properties:
        object_key:
          type: string
          description: >-
            Key of the object in the evidence bucket, derived from the subject
            of the token and the digest. It is the one that travels with the
            filing.
          example: evidence/9f4ce9cd-85c7-4603-b8e9-0def7c3e1ddd/9f2c4a1e8b0d6f35.jpg
        upload_url:
          type: string
          format: uri
          description: Signed URL of the PUT. It expires in 10 minutes.
        upload_headers:
          type: object
          description: >-
            The headers the PUT has to carry, exactly these: the signature
            covers them. The set is decided by the signature, so the client
            sends them as they arrive. Authorization is not one of them.
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    EvidenceItem:
      type: object
      required: [object_key, kind, captured_at, latitude, longitude, accuracy_m, location_trusted, sha256, byte_size]
      description: >-
        One capture that travels with the filing: its key and its capture.
      properties:
        object_key:
          type: string
          description: >-
            The key the signed upload answered. It has to exist in the bucket
            and belong to the subject of the token.
        kind:
          $ref: "#/components/schemas/EvidenceKind"
        captured_at:
          type: string
          format: date-time
          description: Not in the future and not before the incident happened.
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        altitude_m:
          type: number
          description: Optional. Metres above sea level.
        accuracy_m:
          type: number
          description: Accuracy of the location, in metres.
          minimum: 0
        location_trusted:
          type: boolean
          description: >-
            False when the accuracy is worse than 50 m or there was no recent
            reading. The service downgrades it when the accuracy does not
            support it, whatever the client says.
        sha256:
          $ref: "#/components/schemas/SHA256"
        byte_size:
          type: integer
          format: int64
        duration_s:
          type: integer
          description: Only in a video. Up to 30 seconds.
          minimum: 1
          maximum: 30
    EvidenceCount:
      type: object
      description: What ended up associated with the case.
      required: [photos, videos]
      properties:
        photos:
          type: integer
        videos:
          type: integer
    EvidenceKind:
      type: string
      enum: [photo, video]
    SHA256:
      type: string
      description: >-
        Digest of the file, in lowercase hexadecimal. It has to match the one
        of the stored object.
      pattern: '^[0-9a-f]{64}$'
    IncidentType:
      type: string
      description: >-
        Every claim type of the platform. The mobile filing (HU-M2.2-01)
        accepts collision, theft, third_party_damage and other; the web
        filing (HU-W2.1-01) accepts the types of catalog claim-catalog-v1.
      enum: [collision, theft, third_party_damage, glass, water_damage, other]
    PolicyLine:
      type: string
      enum: [auto, home]
    ClaimIncidentType:
      type: string
      description: >-
        The type of a claim as it is read: every IncidentType, and
        flight_delay, the parameter of a claim the parametric engine resolved
        (HU-M2.4-01), which no filing accepts.
      enum: [collision, theft, third_party_damage, glass, water_damage, other, flight_delay]
    AutomaticResolution:
      type: object
      description: >-
        HU-M2.4-01. A claim the parametric engine filed and resolved by
        itself when an external event crossed the threshold of its policy.
      required: [resolved_at, rule_version, trigger]
      properties:
        resolved_at:
          type: string
          format: date-time
        rule_version:
          type: string
          example: parametric-rules-v1
        trigger:
          type: object
          required: [parameter, event_reference, threshold, observed, unit, observed_at]
          properties:
            parameter:
              type: string
              example: flight_delay
            event_reference:
              type: string
              description: What was observed, such as the flight.
              example: AV-8421
            threshold:
              type: number
              example: 180
            observed:
              type: number
              description: The value that made it pay; at least the threshold.
              example: 215
            unit:
              type: string
              example: minutes
            observed_at:
              type: string
              format: date-time
    FileFormat:
      type: string
      enum: [jpeg, png, pdf]
    FilingOptions:
      type: object
      required: [catalog_version, policies]
      properties:
        catalog_version:
          type: string
          example: claim-catalog-v1
        policies:
          type: array
          description: Empty when the insured has no active policy with filed claim types.
          items:
            $ref: "#/components/schemas/EligiblePolicy"
    EligiblePolicy:
      type: object
      required: [policy_id, line, product, insured_object, valid_from, valid_to, incident_types]
      properties:
        policy_id:
          type: string
          example: AU-2025-118204
        line:
          $ref: "#/components/schemas/PolicyLine"
        product:
          type: string
          example: Autos
        insured_object:
          type: string
          description: What the policy insures, as the core of the policies names it (a plate, an address).
          example: KJT-482
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          description: First instant the policy no longer covers.
        incident_types:
          type: array
          items:
            $ref: "#/components/schemas/IncidentOption"
    IncidentOption:
      type: object
      required: [code, label, requirements]
      properties:
        code:
          $ref: "#/components/schemas/IncidentType"
        label:
          type: string
          example: Colisión con daños al vehículo
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
    Requirement:
      type: object
      required: [code, label, required, min_files, max_files, formats]
      properties:
        code:
          type: string
          example: vehicle_photos
        label:
          type: string
          example: Fotos del vehículo
        required:
          type: boolean
        min_files:
          type: integer
          minimum: 0
          description: 0 when the support is optional.
        max_files:
          type: integer
          minimum: 1
        formats:
          type: array
          items:
            $ref: "#/components/schemas/FileFormat"
    SupportDeclaration:
      type: object
      required: [file_name, content_type, byte_size, sha256]
      description: What the portal declares about a file it holds, before uploading it.
      properties:
        file_name:
          type: string
          description: Shown to the insured; directories and control characters are removed, up to 120 characters.
        content_type:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        byte_size:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
        sha256:
          $ref: "#/components/schemas/SHA256"
    SupportUpload:
      type: object
      required: [support_id, file_name, content_type, byte_size, sha256, upload_url, upload_headers, expires_at]
      properties:
        support_id:
          type: string
          pattern: '^sup-[0-9a-f]{32}$'
        file_name:
          type: string
          maxLength: 120
        content_type:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        byte_size:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          $ref: "#/components/schemas/SHA256"
        upload_url:
          type: string
          format: uri
          description: Signed URL of the PUT. It expires in 10 minutes.
        upload_headers:
          type: object
          description: >-
            The headers the PUT has to carry, exactly these: the signature
            covers them. Authorization is not one of them.
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    ConfirmedSupport:
      type: object
      required: [support_id, file_name, content_type, byte_size, sha256, confirmed_at]
      properties:
        support_id:
          type: string
          pattern: '^sup-[0-9a-f]{32}$'
        file_name:
          type: string
          maxLength: 120
        content_type:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
          description: Checked against the content of the file.
        byte_size:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          $ref: "#/components/schemas/SHA256"
        confirmed_at:
          type: string
          format: date-time
    WebFilingRequest:
      type: object
      required: [policy_id, incident_type, occurred_at, place, description, supports]
      properties:
        policy_id:
          type: string
          pattern: '^[A-Za-z0-9-]{3,40}$'
          example: AU-2025-118204
        incident_type:
          $ref: "#/components/schemas/IncidentType"
        occurred_at:
          type: string
          format: date-time
          description: >-
            Not in the future, no older than five years, and within the
            validity of the policy.
        place:
          type: string
          minLength: 3
          maxLength: 160
        description:
          type: string
          minLength: 10
          maxLength: 1000
        supports:
          type: array
          description: >-
            The confirmed supports, grouped by the requirement of the catalog
            they answer. At most 20 files in all. A support that does not
            exist, is not the insured's, is repeated or was never confirmed
            answers not_found.
          maxItems: 20
          items:
            $ref: "#/components/schemas/SupportGroup"
        estimated_amount_minor:
          $ref: "#/components/schemas/EstimatedAmountMinor"
    EstimatedAmountMinor:
      type: integer
      format: int64
      minimum: 1
      maximum: 10000000000000
      description: >-
        What the insured estimates the loss at, in cents of COP (HU-W2.2-01
        on the web, HU-M2.2-01 on the phone). Optional: without it the claim has no estimated amount and its triage
        amount band is unknown. Outside the range, or not an integer, answers
        422 with the field code out_of_range or invalid_format.
      example: 480000000
    SupportGroup:
      type: object
      required: [requirement_code, support_ids]
      properties:
        requirement_code:
          type: string
          pattern: '^[a-z_]{1,40}$'
          example: vehicle_photos
        support_ids:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: '^sup-[0-9a-f]{32}$'
    PolicySummary:
      type: object
      required: [policy_id, line, product, insured_object]
      description: >-
        The policy as it was when the claim was filed. A claim filed from the
        mobile app has no snapshot: line, product and insured_object are null.
      properties:
        policy_id:
          type: string
        line:
          type: string
          description: travel is the policy of a parametric claim (HU-M2.4-01).
          enum: [auto, home, travel]
          nullable: true
        product:
          type: string
          nullable: true
        insured_object:
          type: string
          nullable: true
    AttachedFile:
      type: object
      required: [support_id, file_name, content_type, byte_size]
      properties:
        support_id:
          type: string
        file_name:
          type: string
        content_type:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        byte_size:
          type: integer
    SupportsSummary:
      type: object
      required: [required_total, required_attached, files, items]
      description: All zero and empty for a claim filed from the mobile app.
      properties:
        required_total:
          type: integer
          description: Required supports of the claim type.
        required_attached:
          type: integer
          description: Required supports that have their files.
        files:
          type: integer
          description: Files attached to the claim.
        items:
          type: array
          items:
            type: object
            required: [requirement_code, label, files]
            properties:
              requirement_code:
                type: string
              label:
                type: string
              files:
                type: array
                items:
                  $ref: "#/components/schemas/AttachedFile"
    ClaimDetail:
      type: object
      required: [claim_id, filing_number, status, channel, policy, incident_type, occurred_at, place, description, filed_at, supports, evidence,
        automatic_resolution]
      properties:
        automatic_resolution:
          allOf:
            - $ref: "#/components/schemas/AutomaticResolution"
          nullable: true
          description: HU-M2.4-01. Null for a claim evaluated by an analyst.
        stale:
          type: boolean
          description: >-
            HA-L02. True when the database did not answer within 900 ms and
            this is the last read kept in the read cache; the data may be out
            of date.
        as_of:
          type: string
          format: date-time
          description: >-
            HA-L02. When the data was read from the database: now for a
            fresh read, the time of the cached read when stale is true.
        claim_id:
          type: string
          example: 8f14e45f-ceea-467a-9f3a-5a2d0b1c7e90
        filing_number:
          type: string
          description: SIN-<year>-<five digits>, unique in the platform.
          example: SIN-2026-01712
        estimated_amount_minor:
          allOf:
            - $ref: "#/components/schemas/EstimatedAmountMinor"
          description: >-
            The estimated amount the insured declared, in cents of COP
            (HU-W2.2-01). Absent when it was not declared (always in a claim
            filed from the mobile app).
        status:
          type: string
          enum: [active, returned, in_evaluation, approved, paid, rejected, payment_exception]
        channel:
          type: string
          description: parametric is a claim the parametric engine filed and resolved by itself (HU-M2.4-01).
          enum: [mobile, web, parametric]
        policy:
          $ref: "#/components/schemas/PolicySummary"
        incident_type:
          $ref: "#/components/schemas/ClaimIncidentType"
        occurred_at:
          type: string
          format: date-time
        place:
          type: string
        description:
          type: string
        filed_at:
          type: string
          format: date-time
        supports:
          $ref: "#/components/schemas/SupportsSummary"
        evidence:
          type: array
          description: >-
            The photographs and the video that the insured captured in the
            place of the incident, in the order of capture (HU-M2.1-01). Empty
            in a claim filed on the web, whose files are the supports.
          items:
            $ref: "#/components/schemas/EvidenceView"
    EvidenceView:
      type: object
      required: [kind, content_type, captured_at, latitude, longitude, accuracy_m, location_trusted, byte_size, duration_s, download_url, download_expires_at]
      properties:
        kind:
          $ref: "#/components/schemas/EvidenceKind"
        content_type:
          type: string
          enum: [image/jpeg, video/mp4]
        captured_at:
          type: string
          format: date-time
        latitude:
          type: number
        longitude:
          type: number
        accuracy_m:
          type: number
        location_trusted:
          type: boolean
          description: False when the precision of the location was worse than 50 m.
        byte_size:
          type: integer
          format: int64
        duration_s:
          type: integer
          description: Seconds of a video; 0 in a photograph.
        download_url:
          type: string
          format: uri
          nullable: true
          description: >-
            Signed URL that reads the file. It expires at download_expires_at
            (10 minutes). Null when it could not be signed: the rest of the
            detail is still valid.
        download_expires_at:
          type: string
          format: date-time
          nullable: true
    ClaimSummary:
      type: object
      required: [claim_id, filing_number, status, channel, policy, incident_type, occurred_at, filed_at,
        automatic_resolution]
      properties:
        automatic_resolution:
          allOf:
            - $ref: "#/components/schemas/AutomaticResolution"
          nullable: true
          description: HU-M2.4-01. Null for a claim evaluated by an analyst.
        claim_id:
          type: string
        filing_number:
          type: string
        status:
          type: string
          enum: [active, returned, in_evaluation, approved, paid, rejected, payment_exception]
        channel:
          type: string
          description: parametric is a claim the parametric engine filed and resolved by itself (HU-M2.4-01).
          enum: [mobile, web, parametric]
        policy:
          $ref: "#/components/schemas/PolicySummary"
        incident_type:
          $ref: "#/components/schemas/ClaimIncidentType"
        occurred_at:
          type: string
          format: date-time
        filed_at:
          type: string
          format: date-time
    ClaimList:
      type: object
      required: [items, next_page_token, stale, as_of]
      properties:
        stale:
          type: boolean
          description: >-
            HA-L02. True when the database did not answer within 900 ms and
            this is the last read kept in the read cache; the data may be out
            of date.
        as_of:
          type: string
          format: date-time
          description: >-
            HA-L02. When the data was read from the database: now for a
            fresh read, the time of the cached read when stale is true.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClaimSummary"
        next_page_token:
          type: string
          nullable: true
          description: Null on the last page.
    WebValidationError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [validation_failed, idempotency_key_reused]
        message:
          type: string
        fields:
          type: array
          description: >-
            Every invalid field at once. A support is named
            supports.<requirement_code>; the list itself, supports.
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
                example: supports.traffic_report
              code:
                type: string
                enum: [required, invalid_format, out_of_range, missing, too_few, too_many, not_applicable, not_found]
    PolicyNotEligible:
      type: object
      required: [error, message, reason, valid_from, valid_to]
      properties:
        error:
          type: string
          enum: [policy_not_eligible]
        message:
          type: string
        reason:
          type: string
          enum: [policy_not_found, policy_not_active, incident_not_covered, occurred_outside_validity]
        valid_from:
          type: string
          format: date-time
          nullable: true
          description: Validity of the policy; null when the reason is policy_not_found.
        valid_to:
          type: string
          format: date-time
          nullable: true
    TriageLevel:
      type: integer
      enum: [1, 2, 3]
      description: >-
        Triage 1 when the severity is high or the amount band is high; Triage 3
        when the severity is low and the amount band is low; Triage 2 otherwise.
    Severity:
      type: string
      enum: [high, medium, low]
      description: From the claim type and the coverage it affects.
    AmountBand:
      type: string
      enum: [high, medium, low, unknown]
      description: >-
        low below the low threshold, high above the high threshold, medium in
        between (both thresholds included), unknown when the claim has no
        estimated amount. unknown never moves the level to 1 or to 3.
    TriageCause:
      type: string
      enum:
        - entered_evaluation
        - estimated_amount_changed
        - incident_type_changed
        - coverage_changed
        - provider_report_received
        - policy_updated
    TriageTarget:
      type: object
      required: [kind, business_days, resolution_business_days]
      description: >-
        The attention target of the level, shown next to it in the queue, and
        the resolution time the insured is told.
      properties:
        kind:
          type: string
          enum: [immediate, business_days]
          description: immediate for Triage 1 (attend first).
        business_days:
          type: integer
          nullable: true
          description: Attention target in business days; null when kind is immediate.
          example: 5
        resolution_business_days:
          type: integer
          description: Estimated resolution time in business days.
          example: 5
    TriageAssessment:
      type: object
      required: [level, severity, amount_band, estimated_amount_minor, currency, incident_type, coverage, policy_version, target, assessed_at]
      properties:
        level:
          $ref: "#/components/schemas/TriageLevel"
        severity:
          $ref: "#/components/schemas/Severity"
        amount_band:
          $ref: "#/components/schemas/AmountBand"
        estimated_amount_minor:
          allOf:
            - $ref: "#/components/schemas/EstimatedAmountMinor"
          nullable: true
          description: The amount the level was calculated with; null when there was none.
        currency:
          type: string
          enum: [COP]
        incident_type:
          $ref: "#/components/schemas/IncidentType"
        coverage:
          type: string
          description: The coverage of the policy the claim affects (today, the one of its claim type).
          example: water_damage
        policy_version:
          type: string
          example: triage-policy-v1
        target:
          $ref: "#/components/schemas/TriageTarget"
        assessed_at:
          type: string
          format: date-time
    TriageHistoryEntry:
      type: object
      required: [level, previous_level, severity, amount_band, estimated_amount_minor, incident_type, causes, actor, policy_version, assessed_at]
      properties:
        level:
          $ref: "#/components/schemas/TriageLevel"
        previous_level:
          allOf:
            - $ref: "#/components/schemas/TriageLevel"
          nullable: true
          description: Null in the first calculation. The same as level when the information changed but the level did not.
        severity:
          $ref: "#/components/schemas/Severity"
        amount_band:
          $ref: "#/components/schemas/AmountBand"
        estimated_amount_minor:
          allOf:
            - $ref: "#/components/schemas/EstimatedAmountMinor"
          nullable: true
        incident_type:
          $ref: "#/components/schemas/IncidentType"
        causes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TriageCause"
        actor:
          type: string
          enum: [system]
          description: The triage is always automatic.
        policy_version:
          type: string
        assessed_at:
          type: string
          format: date-time
    ClaimTriage:
      type: object
      required: [view, claim_id, state, current, history]
      description: >-
        The view of operations. state is pending before the first calculation,
        not_applicable when the claim never entered evaluation, and assessed
        once it has a level, which stays visible after the claim leaves
        evaluation (paid, rejected, returned) although it is no longer
        recalculated.
      properties:
        view:
          type: string
          enum: [operations]
        claim_id:
          type: string
          example: 8f14e45f-ceea-467a-9f3a-5a2d0b1c7e90
        state:
          type: string
          enum: [pending, assessed, not_applicable]
        current:
          allOf:
            - $ref: "#/components/schemas/TriageAssessment"
          nullable: true
          description: Null unless state is assessed.
        history:
          type: array
          description: Every calculation, newest first. Empty before the first one.
          items:
            $ref: "#/components/schemas/TriageHistoryEntry"
    ClaimTriageForInsured:
      type: object
      required: [view, claim_id, state, level, estimated_resolution_business_days, assessed_at]
      description: >-
        The view of the insured who filed the claim: the level and how long the
        resolution is expected to take. Without severity, amount or history.
      properties:
        view:
          type: string
          enum: [insured]
        claim_id:
          type: string
        state:
          type: string
          enum: [pending, assessed, not_applicable]
        level:
          allOf:
            - $ref: "#/components/schemas/TriageLevel"
          nullable: true
        estimated_resolution_business_days:
          type: integer
          nullable: true
          example: 5
        assessed_at:
          type: string
          format: date-time
          nullable: true
    ClaimTriageSummary:
      type: object
      required: [claim_id, state, level, severity, amount_band, target, assessed_at]
      description: The triage of one claim of a page. Everything but claim_id and state is null unless state is assessed.
      properties:
        claim_id:
          type: string
        state:
          type: string
          enum: [pending, assessed, not_applicable, not_found]
        level:
          allOf:
            - $ref: "#/components/schemas/TriageLevel"
          nullable: true
        severity:
          allOf:
            - $ref: "#/components/schemas/Severity"
          nullable: true
        amount_band:
          allOf:
            - $ref: "#/components/schemas/AmountBand"
          nullable: true
        target:
          allOf:
            - $ref: "#/components/schemas/TriageTarget"
          nullable: true
        assessed_at:
          type: string
          format: date-time
          nullable: true
    ClaimTriageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClaimTriageSummary"
    EvaluationQueue:
      type: object
      required: [items, next_page_token]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationQueueItem"
        next_page_token:
          type: string
          nullable: true
    EvaluationQueueItem:
      allOf:
        - $ref: "#/components/schemas/ClaimSummary"
        - type: object
          required: [estimated_amount_minor, triage]
          properties:
            estimated_amount_minor:
              type: integer
              format: int64
              nullable: true
              description: In cents of COP; null when the insured did not declare it.
            triage:
              $ref: "#/components/schemas/ClaimTriageSummary"
    Coverage:
      type: object
      required: [incident, insured_value_minor, currency, deductible_basis_points]
      properties:
        incident:
          type: string
        insured_value_minor:
          type: integer
          format: int64
          description: The most an indemnity can be, in cents of the currency.
        currency:
          type: string
          example: COP
        deductible_basis_points:
          type: integer
          minimum: 0
          maximum: 10000
          description: Share of the gross amount that is not paid; 500 is 5 percent.
    CurrentPolicy:
      type: object
      required: [policy_id, line, product, insured_object, status, valid_from, valid_to, coverages]
      properties:
        policy_id:
          type: string
        line:
          type: string
        product:
          type: string
        insured_object:
          type: string
        status:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        coverages:
          type: array
          items:
            $ref: "#/components/schemas/Coverage"
    PayoutAccountMasked:
      type: object
      required: [bank_code, bank_name, account_type, masked_number]
      properties:
        bank_code:
          type: string
        bank_name:
          type: string
        account_type:
          type: string
        masked_number:
          type: string
          description: Only the last four digits; the full number never leaves the service in a read.
    Holder:
      type: object
      required: [full_name, document_type, document_id, email, phone, payout_account]
      properties:
        full_name:
          type: string
        document_type:
          type: string
        document_id:
          type: string
        email:
          type: string
        phone:
          type: string
        payout_account:
          $ref: "#/components/schemas/PayoutAccountMasked"
    SupportFileLink:
      type: object
      required: [support_id, requirement_code, file_name, content_type, byte_size, sha256, download_url, download_expires_at]
      properties:
        support_id:
          type: string
        requirement_code:
          type: string
        file_name:
          type: string
        content_type:
          type: string
        byte_size:
          type: integer
          format: int64
        sha256:
          type: string
        download_url:
          type: string
          nullable: true
          description: Signed read of 10 minutes; null when it could not be signed.
        download_expires_at:
          type: string
          format: date-time
          nullable: true
    ClaimEvaluation:
      type: object
      required: [claim, support_files, triage, policy, coverage, holder, policy_unavailable, decision]
      properties:
        claim:
          $ref: "#/components/schemas/ClaimDetail"
        support_files:
          type: array
          items:
            $ref: "#/components/schemas/SupportFileLink"
        triage:
          $ref: "#/components/schemas/ClaimTriage"
        policy:
          allOf:
            - $ref: "#/components/schemas/CurrentPolicy"
          nullable: true
        coverage:
          allOf:
            - $ref: "#/components/schemas/Coverage"
          nullable: true
        holder:
          allOf:
            - $ref: "#/components/schemas/Holder"
          nullable: true
        policy_unavailable:
          type: boolean
        decision:
          allOf:
            - $ref: "#/components/schemas/ClaimDecision"
          nullable: true
          description: What operations decided; null while the claim is in evaluation.
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [gross_amount_minor]
      properties:
        gross_amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The cost the analyst approves, before the deductible, in cents of
            the currency of the coverage. What the insurer pays (the approved
            amount of screen O6) is payout_amount_minor of the answer.
    RejectionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Why the claim is rejected; the insured receives it.
    PayoutDestination:
      type: object
      additionalProperties: false
      required: [bank_code, account_type, account_number]
      properties:
        bank_code:
          type: string
          pattern: "^[0-9]{3,6}$"
        bank_name:
          type: string
          maxLength: 80
        account_type:
          type: string
          enum: [savings, checking]
        account_number:
          type: string
          pattern: "^[0-9][0-9-]{4,22}[0-9]$"
    PayoutRetryRequest:
      type: object
      additionalProperties: false
      properties:
        destination:
          $ref: "#/components/schemas/PayoutDestination"
    DecisionApproval:
      type: object
      required: [gross_amount_minor, insured_value_minor, deductible_basis_points, deductible_minor, payout_amount_minor, currency]
      properties:
        gross_amount_minor:
          type: integer
          format: int64
        insured_value_minor:
          type: integer
          format: int64
          description: The insured value the gross amount was checked against.
        deductible_basis_points:
          type: integer
        deductible_minor:
          type: integer
          format: int64
        payout_amount_minor:
          type: integer
          format: int64
          description: >-
            What the insurer pays and reaches the insured: the gross amount
            less the deductible, which the insured bears. It is the approved
            amount screen O6 shows.
        currency:
          type: string
    Payout:
      type: object
      required: [payment_reference, status, destination, automatic_attempts, max_automatic_attempts, failure, gateway_code,
        last_failure_at, gateway_reference, paid_at, manual_retries, last_retried_by, last_retried_at]
      properties:
        payment_reference:
          type: string
          description: The idempotency key of the payout; it never changes, however many times it is retried.
        status:
          type: string
          enum: [pending, in_progress, paid, failed]
        destination:
          $ref: "#/components/schemas/PayoutAccountMasked"
        automatic_attempts:
          type: integer
          description: Failed attempts since the approval or the last manual retry.
        max_automatic_attempts:
          type: integer
        failure:
          type: string
          nullable: true
          description: rejected (the gateway rejected it) or retries_exhausted; null unless the payout failed.
        gateway_code:
          type: string
          nullable: true
          description: The reason of the gateway for a rejection, e.g. invalid_destination_account.
        last_failure_at:
          type: string
          format: date-time
          nullable: true
        gateway_reference:
          type: string
          nullable: true
          description: The id of the payout at the gateway, once paid.
        paid_at:
          type: string
          format: date-time
          nullable: true
        manual_retries:
          type: integer
        last_retried_by:
          type: string
          nullable: true
        last_retried_at:
          type: string
          format: date-time
          nullable: true
    Rejection:
      type: object
      required: [reason, notified_at]
      properties:
        reason:
          type: string
        notified_at:
          type: string
          format: date-time
          nullable: true
          description: When the insured was told; null while the notice is pending.
    ClaimDecision:
      type: object
      required: [claim_id, filing_number, status, outcome, decided_by, decided_at, approval, payout, rejection]
      properties:
        claim_id:
          type: string
        filing_number:
          type: string
        status:
          type: string
          enum: [approved, paid, rejected, payment_exception]
          description: The status the decision leaves the claim in.
        outcome:
          type: string
          enum: [approved, rejected]
        decided_by:
          type: string
          description: The analyst who decided (their e-mail).
        decided_at:
          type: string
          format: date-time
        approval:
          allOf:
            - $ref: "#/components/schemas/DecisionApproval"
          nullable: true
        payout:
          allOf:
            - $ref: "#/components/schemas/Payout"
          nullable: true
        rejection:
          allOf:
            - $ref: "#/components/schemas/Rejection"
          nullable: true
    TriagePolicy:
      type: object
      required: [version, currency, amount_thresholds, severity, targets]
      properties:
        version:
          type: string
          example: triage-policy-v1
        currency:
          type: string
          enum: [COP]
        amount_thresholds:
          type: object
          required: [low_below_minor, high_above_minor]
          properties:
            low_below_minor:
              type: integer
              format: int64
              description: An amount below this one (in cents) is in the low band.
              example: 500000000
            high_above_minor:
              type: integer
              format: int64
              description: An amount above this one (in cents) is in the high band.
              example: 3000000000
        severity:
          type: array
          items:
            type: object
            required: [line, incident_type, severity]
            properties:
              line:
                $ref: "#/components/schemas/PolicyLine"
              incident_type:
                $ref: "#/components/schemas/IncidentType"
              severity:
                $ref: "#/components/schemas/Severity"
        targets:
          type: array
          items:
            type: object
            required: [level, target]
            properties:
              level:
                $ref: "#/components/schemas/TriageLevel"
              target:
                $ref: "#/components/schemas/TriageTarget"
    ClaimStatus:
      type: string
      description: >-
        active: filed, waiting for the review of the advisor. returned: the
        advisor returned it to the insured to complete (HU-W2.1-03).
        in_evaluation: approved by the advisor, with operations. approved,
        paid, rejected and payment_exception: the decision of operations
        (HU-W2.2-03).
      enum: [active, returned, in_evaluation, approved, paid, rejected, payment_exception]
    CorrectableFact:
      type: string
      description: A fact of the filing the advisor asks the insured to correct.
      enum: [occurred_at, place, description, estimated_amount]
    ReturnReasonCode:
      type: string
      description: Why the filing is returned (screen S8).
      enum: [illegible_or_incomplete_supports, inconsistent_facts, missing_information, other]
    SupportVerdict:
      type: string
      description: >-
        valid: attached and serves. illegible: attached but does not serve, the
        insured replaces it. missing: not attached, a required support or an
        optional one the advisor asks for.
      enum: [valid, illegible, missing]
    ReturnRequest:
      type: object
      additionalProperties: false
      required: [reason_code, message]
      properties:
        reason_code:
          $ref: "#/components/schemas/ReturnReasonCode"
        message:
          type: string
          minLength: 1
          maxLength: 1000
          description: What the insured reads (screen A9).
        supports:
          type: array
          maxItems: 12
          description: >-
            The verdict on the supports that do not serve. An attached support
            that is not listed is valid; a required one that is not attached is
            missing. An attached support takes valid or illegible; one that is
            not attached, only missing (to ask for an optional one). A code
            appears once.
          items:
            type: object
            additionalProperties: false
            required: [requirement_code, verdict]
            properties:
              requirement_code:
                type: string
                minLength: 1
                maxLength: 40
                example: traffic_report
              verdict:
                $ref: "#/components/schemas/SupportVerdict"
              note:
                type: string
                maxLength: 300
                description: Why, as the insured reads it next to the support.
                example: borroso, no se lee el número de croquis
        facts_to_correct:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CorrectableFact"
    SupportAssessment:
      type: object
      required: [requirement_code, label, verdict, note]
      properties:
        requirement_code:
          type: string
        label:
          type: string
          example: Informe de tránsito o croquis
        verdict:
          $ref: "#/components/schemas/SupportVerdict"
        note:
          type: string
          nullable: true
    Review:
      type: object
      required: [seq, outcome, reviewed_by, reviewer_name, reviewed_at, reason_code, message, supports, facts_to_correct]
      properties:
        seq:
          type: integer
          minimum: 1
          description: 1 for the first review of the filing, 2 after it was sent again, and so on.
        outcome:
          type: string
          enum: [approved, returned]
        reviewed_by:
          type: string
          description: The advisor who reviewed it (e-mail of the token).
        reviewer_name:
          type: string
          description: The name of the advisor, as the insured reads it; the e-mail when the user has no name.
        reviewed_at:
          type: string
          format: date-time
        reason_code:
          allOf:
            - $ref: "#/components/schemas/ReturnReasonCode"
          nullable: true
          description: null when it was approved.
        message:
          type: string
          nullable: true
          description: What the insured reads; null when it was approved.
        supports:
          type: array
          description: >-
            The verdict on every support that is attached, or missing and
            required or asked for. An approval has every attached support
            valid.
          items:
            $ref: "#/components/schemas/SupportAssessment"
        facts_to_correct:
          type: array
          items:
            $ref: "#/components/schemas/CorrectableFact"
    ReviewOutcome:
      type: object
      required: [claim_id, filing_number, status, review]
      properties:
        claim_id:
          type: string
        filing_number:
          type: string
        status:
          $ref: "#/components/schemas/ClaimStatus"
        review:
          $ref: "#/components/schemas/Review"
    ChecklistItem:
      type: object
      required: [requirement_code, label, required, files]
      properties:
        requirement_code:
          type: string
        label:
          type: string
        required:
          type: boolean
        files:
          type: integer
          minimum: 0
          description: >-
            Files attached for it. In a filing of the phone, the evidence counts
            as vehicle_photos, the only support it requires.
    ClaimReview:
      allOf:
        - $ref: "#/components/schemas/ClaimEvaluation"
        - type: object
          required: [checklist, prior_claims, reviews]
          properties:
            checklist:
              type: array
              description: Every support of the claim type, in the order of the catalog (screen S8).
              items:
                $ref: "#/components/schemas/ChecklistItem"
            prior_claims:
              type: array
              description: The other claims the insured filed on the same policy, newest first, up to 20.
              items:
                $ref: "#/components/schemas/ClaimSummary"
            reviews:
              type: array
              description: The reviews of the filing, oldest first.
              items:
                $ref: "#/components/schemas/Review"
    StatusChange:
      type: object
      required: [id, status, previous_status, changed_at]
      properties:
        id:
          type: integer
          format: int64
          description: Grows with every change of every claim, so it also orders changes of different claims.
        status:
          $ref: "#/components/schemas/ClaimStatus"
        previous_status:
          allOf:
            - $ref: "#/components/schemas/ClaimStatus"
          nullable: true
          description: null on the change that filed the claim.
        changed_at:
          type: string
          format: date-time
    ClaimHistory:
      type: object
      required: [claim_id, filing_number, status, last_changed_at, changes, reviews, last_return, resubmissions,
        requirements, stale, as_of, automatic_resolution]
      properties:
        automatic_resolution:
          allOf:
            - $ref: "#/components/schemas/AutomaticResolution"
          nullable: true
          description: >-
            HU-M2.4-01. What resolved the claim when the parametric engine
            did, so the timeline tells it apart from a claim evaluated by an
            analyst; null otherwise.
        stale:
          type: boolean
          description: >-
            HA-L02. True when the database did not answer within 900 ms and
            this is the last read kept in the read cache; the data may be out
            of date.
        as_of:
          type: string
          format: date-time
          description: >-
            HA-L02. When the data was read from the database: now for a
            fresh read, the time of the cached read when stale is true.
        claim_id:
          type: string
        filing_number:
          type: string
        status:
          $ref: "#/components/schemas/ClaimStatus"
        last_changed_at:
          type: string
          format: date-time
          description: When the claim reached its current status.
        changes:
          type: array
          description: Oldest first.
          items:
            $ref: "#/components/schemas/StatusChange"
        reviews:
          type: array
          description: The reviews of the advisor, oldest first (who approved or returned it, screen A8).
          items:
            $ref: "#/components/schemas/Review"
        last_return:
          allOf:
            - $ref: "#/components/schemas/Review"
          nullable: true
          description: The review that returned the claim, while it is returned; null otherwise.
        resubmissions:
          type: array
          description: >-
            HU-W2.1-04. The times the insured sent the claim again after a
            return, oldest first, with what changed.
          items:
            $ref: "#/components/schemas/Resubmission"
        requirements:
          type: array
          description: >-
            HU-W2.1-04. The supports the claim can have, with their rules, in
            the order of the catalog: what the insured uploads to correct a
            returned filing (screen A9). A filing of the phone has its
            photographs of the vehicle as the one required.
          items:
            $ref: "#/components/schemas/Requirement"
    ResubmissionRequest:
      type: object
      additionalProperties: false
      required: [review_seq]
      properties:
        review_seq:
          type: integer
          minimum: 1
          description: The review that returned the claim (last_return.seq of the history).
        occurred_at:
          type: string
          format: date-time
          description: RFC 3339. Not after the filing, and within the validity of the policy filed.
        place:
          type: string
          description: 3 to 160 characters.
        description:
          type: string
          description: 10 to 1000 characters.
        estimated_amount_minor:
          allOf:
            - $ref: "#/components/schemas/EstimatedAmountMinor"
          nullable: true
          description: Null or absent keeps the amount filed.
        supports:
          type: array
          maxItems: 20
          description: >-
            One group per requirement that changes: the whole set of files it
            keeps (ids of the claim and new ones). At most 20 ids in all.
          items:
            $ref: "#/components/schemas/SupportGroup"
    FactChange:
      type: object
      required: [fact, before, after]
      properties:
        fact:
          $ref: "#/components/schemas/CorrectableFact"
        before:
          type: string
          nullable: true
          description: RFC 3339 for occurred_at, cents for estimated_amount; null for no value.
        after:
          type: string
          nullable: true
    SupportChange:
      type: object
      required: [requirement_code, label, added, withdrawn]
      properties:
        requirement_code:
          type: string
          example: traffic_report
        label:
          type: string
          example: Informe de tránsito o croquis
        added:
          type: array
          description: The ids of the files the resubmission added.
          items:
            type: string
        withdrawn:
          type: array
          description: The ids of the files it replaced; they stop being shown.
          items:
            type: string
    Resubmission:
      type: object
      required: [seq, review_seq, resubmitted_by, resubmitted_at, changed_facts, changed_supports]
      properties:
        seq:
          type: integer
          minimum: 1
          description: 1 for the first resubmission of the claim, and so on.
        review_seq:
          type: integer
          minimum: 1
          description: The return it answered.
        resubmitted_by:
          type: string
          description: The subject of the insured who sent it.
        resubmitted_at:
          type: string
          format: date-time
        changed_facts:
          type: array
          items:
            $ref: "#/components/schemas/FactChange"
        changed_supports:
          type: array
          items:
            $ref: "#/components/schemas/SupportChange"
    ResubmissionOutcome:
      type: object
      required: [claim_id, filing_number, status, resubmission]
      properties:
        claim_id:
          type: string
        filing_number:
          type: string
          description: The same filing number.
        status:
          $ref: "#/components/schemas/ClaimStatus"
        resubmission:
          $ref: "#/components/schemas/Resubmission"
    ResubmissionValidationError:
      type: object
      required: [error, message, fields]
      properties:
        error:
          type: string
          enum: [validation_failed]
        message:
          type: string
        fields:
          type: array
          description: >-
            Everything still missing or invalid at once. A support is named
            supports.<requirement_code>; the list itself, supports.
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
                example: supports.traffic_report
              code:
                type: string
                enum: [required, invalid_format, out_of_range, missing, too_few, too_many, not_applicable,
                  not_found, not_replaced]
    Specialty:
      type: string
      description: >-
        The trade of a provider (HU-W2.3-01). vehicle_assessment: vehicle
        assessor; auto_glass: vehicle glass; plumbing: plumbing and damp;
        damp_proofing, painting and bodywork: trades a provider may add.
      enum: [vehicle_assessment, auto_glass, plumbing, damp_proofing, painting, bodywork]
    ProviderAvailability:
      type: string
      description: >-
        available: can take a claim today. unavailable: set by operations,
        optionally until a date. busy: assigned to a claim (busy_claim_id),
        set only by the assignment.
      enum: [available, unavailable, busy]
    Actor:
      type: object
      required: [email, name]
      description: The analyst of operations, from the token.
      properties:
        email:
          type: string
          example: andres.ruiz@solventa.example
        name:
          type: string
          nullable: true
          example: Andrés Ruiz
    FieldValidationError:
      type: object
      required: [error, message, fields]
      properties:
        error:
          type: string
          enum: [validation_failed]
        message:
          type: string
        fields:
          type: array
          description: Every invalid field at once.
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
                example: latitude
              code:
                type: string
                enum: [required, invalid_format, out_of_range]
    IncidentLocationRequest:
      type: object
      additionalProperties: false
      required: [address, latitude, longitude]
      properties:
        address:
          type: string
          minLength: 5
          maxLength: 200
          example: "Carrera 15 # 93-40, apto 402, Bogotá"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 4.6771
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -74.0483
    IncidentLocation:
      type: object
      required: [source, latitude, longitude, accuracy_m, address, recorded_by, recorded_at]
      properties:
        source:
          type: string
          description: >-
            app: the most precise trusted evidence of the phone (precision of 50
            m or better). analyst: recorded by operations.
          enum: [app, analyst]
        latitude:
          type: number
          format: double
          example: 4.6771
        longitude:
          type: number
          format: double
          example: -74.0483
        accuracy_m:
          type: number
          format: double
          nullable: true
          description: Precision of the capture in meters; null when the analyst recorded it.
          example: 8
        address:
          type: string
          nullable: true
          description: The address the analyst recorded; null for the app.
        recorded_by:
          allOf:
            - $ref: "#/components/schemas/Actor"
          nullable: true
          description: null for the app.
        recorded_at:
          type: string
          format: date-time
          description: When the analyst recorded it, or when the phone captured the evidence.
    ProviderSearchRequest:
      type: object
      additionalProperties: false
      properties:
        from_radius_km:
          type: number
          description: >-
            The radius the search starts from; one of radii_km of the policy.
            Absent: the initial radius.
          enum: [5, 10, 20]
    SearchAttempt:
      type: object
      required: [radius_km, eligible_count, attempted_at]
      properties:
        radius_km:
          type: number
          example: 5
        eligible_count:
          type: integer
          minimum: 0
        attempted_at:
          type: string
          format: date-time
    ProviderCandidate:
      type: object
      required: [provider_id, name, specialties, distance_km, availability, unavailable_until, eligibility, suggested]
      properties:
        provider_id:
          type: string
        name:
          type: string
        specialties:
          type: array
          items:
            $ref: "#/components/schemas/Specialty"
        distance_km:
          type: number
          description: Straight-line distance to the incident, rounded to 0.1 km.
          example: 2.3
        availability:
          $ref: "#/components/schemas/ProviderAvailability"
        unavailable_until:
          type: string
          format: date
          nullable: true
        eligibility:
          type: string
          description: >-
            eligible: available and within the radius of the last attempt; only
            these can be assigned. unavailable: unavailable or busy.
            out_of_radius: available but farther than the radius of the last
            attempt.
          enum: [eligible, unavailable, out_of_radius]
        suggested:
          type: boolean
          description: The nearest eligible; ties go to the lowest provider_id.
    ProviderSearch:
      type: object
      required: [seq, trigger, searched_by, specialty, location, from_radius_km, outcome, radius_km, reason, policy_version,
        searched_at, attempts, candidates]
      properties:
        seq:
          type: integer
          minimum: 1
          description: Number of the search in the claim; the assignment names it.
        trigger:
          type: string
          description: analyst, or automatic_retry of a claim pending assignment.
          enum: [analyst, automatic_retry]
        searched_by:
          allOf:
            - $ref: "#/components/schemas/Actor"
          nullable: true
          description: null for automatic_retry.
        specialty:
          $ref: "#/components/schemas/Specialty"
        location:
          type: object
          required: [source, latitude, longitude]
          description: The location the search measured from.
          properties:
            source:
              type: string
              enum: [app, analyst]
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
        from_radius_km:
          type: number
          example: 5
        outcome:
          type: string
          description: found - a radius had eligible providers; exhausted - none up to the maximum radius.
          enum: [found, exhausted]
        radius_km:
          type: number
          description: The radius of the last attempt (where it found, or the maximum).
          example: 5
        reason:
          type: string
          nullable: true
          description: Why the claim is pending assignment; null when found.
          enum: [no_eligible_provider_within_max_radius]
        policy_version:
          type: string
          example: assignment-policy-v1
        searched_at:
          type: string
          format: date-time
        attempts:
          type: array
          description: Every radius tried, in order.
          items:
            $ref: "#/components/schemas/SearchAttempt"
        candidates:
          type: array
          description: >-
            The providers with the specialty, nearest first, up to 20, eligible
            or not, so the analyst sees why each one is not.
          maxItems: 20
          items:
            $ref: "#/components/schemas/ProviderCandidate"
    AssignmentRequest:
      type: object
      additionalProperties: false
      required: [provider_id, search_seq]
      properties:
        provider_id:
          type: string
          pattern: '^prv-[a-z0-9-]{3,40}$'
          example: prv-servicios-hogar-norte
        search_seq:
          type: integer
          minimum: 1
          description: The seq of the last search, which the analyst saw.
    Assignment:
      type: object
      required: [provider, assigned_by, assigned_at, distance_km, search_seq, location_shared, policy_version, notice]
      properties:
        provider:
          type: object
          required: [id, name, contact_email, contact_phone]
          description: The provider as it was when assigned.
          properties:
            id:
              type: string
            name:
              type: string
            contact_email:
              type: string
              format: email
            contact_phone:
              type: string
              nullable: true
        assigned_by:
          $ref: "#/components/schemas/Actor"
        assigned_at:
          type: string
          format: date-time
        distance_km:
          type: number
          example: 2.3
        search_seq:
          type: integer
          minimum: 1
        location_shared:
          type: object
          required: [source, latitude, longitude, accuracy_m, address]
          description: What the provider received to get to the site.
          properties:
            source:
              type: string
              enum: [app, analyst]
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
            accuracy_m:
              type: number
              format: double
              nullable: true
            address:
              type: string
              nullable: true
        policy_version:
          type: string
        notice:
          type: object
          required: [status, attempts, sent_at]
          description: The e-mail to the provider; retried until it leaves.
          properties:
            status:
              type: string
              enum: [pending, sent]
            attempts:
              type: integer
              minimum: 0
            sent_at:
              type: string
              format: date-time
              nullable: true
    AssignmentState:
      type: string
      description: >-
        not_required: the claim type needs no on-site visit. not_applicable:
        the claim is not in evaluation and has no assignment. location_missing:
        no coordinates from the app nor a location recorded by the analyst.
        ready: located, not searched yet (or the location changed after the
        last search). proposed: the last search found eligible providers.
        pending_assignment: the last search found none up to the maximum
        radius. assigned: the provider is confirmed.
      enum: [not_required, not_applicable, location_missing, ready, proposed, pending_assignment, assigned]
    ClaimAssignment:
      type: object
      required: [claim_id, filing_number, claim_status, incident_type, line, state, specialty, policy_version, location,
        last_search, assignment]
      properties:
        claim_id:
          type: string
        filing_number:
          type: string
          example: SIN-2026-01655
        claim_status:
          $ref: "#/components/schemas/ClaimStatus"
        incident_type:
          $ref: "#/components/schemas/IncidentType"
        line:
          $ref: "#/components/schemas/PolicyLine"
        state:
          $ref: "#/components/schemas/AssignmentState"
        specialty:
          allOf:
            - $ref: "#/components/schemas/Specialty"
          nullable: true
          description: null when the claim type needs no on-site visit.
        policy_version:
          type: string
          example: assignment-policy-v1
        location:
          allOf:
            - $ref: "#/components/schemas/IncidentLocation"
          nullable: true
        last_search:
          allOf:
            - $ref: "#/components/schemas/ProviderSearch"
          nullable: true
        assignment:
          allOf:
            - $ref: "#/components/schemas/Assignment"
          nullable: true
    AssignmentSummary:
      type: object
      required: [claim_id, state, specialty, provider_name, distance_km, assigned_at, reason]
      properties:
        claim_id:
          type: string
        state:
          type: string
          description: The states of AssignmentState, plus not_found for a claim that does not exist.
          enum: [not_required, not_applicable, location_missing, ready, proposed, pending_assignment, assigned, not_found]
        specialty:
          allOf:
            - $ref: "#/components/schemas/Specialty"
          nullable: true
        provider_name:
          type: string
          nullable: true
        distance_km:
          type: number
          nullable: true
        assigned_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true
          enum: [no_eligible_provider_within_max_radius]
    AssignmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentSummary"
    AssignmentPolicy:
      type: object
      required: [version, radii_km, initial_radius_km, max_radius_km, specialties, retry_interval_seconds]
      properties:
        version:
          type: string
          example: assignment-policy-v1
        radii_km:
          type: array
          description: The radii the search widens through, in order.
          items:
            type: number
          example: [5, 10, 20]
        initial_radius_km:
          type: number
          example: 5
        max_radius_km:
          type: number
          example: 20
        specialties:
          type: array
          items:
            type: object
            required: [line, incident_type, specialty]
            properties:
              line:
                $ref: "#/components/schemas/PolicyLine"
              incident_type:
                $ref: "#/components/schemas/IncidentType"
              specialty:
                allOf:
                  - $ref: "#/components/schemas/Specialty"
                nullable: true
                description: null - the claim type needs no on-site visit (theft).
        retry_interval_seconds:
          type: integer
          description: How often a claim pending assignment is searched again.
          example: 300
    ProviderProfile:
      type: object
      additionalProperties: false
      required: [name, specialties, latitude, longitude, address, contact_email]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
          example: Servicios Hogar Norte
        specialties:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Specialty"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        address:
          type: string
          minLength: 5
          maxLength: 200
        contact_email:
          type: string
          format: email
          maxLength: 254
          description: The channel the provider receives its assignments by.
        contact_phone:
          type: string
          nullable: true
          pattern: '^\+[1-9][0-9]{6,14}$'
          description: Informative, in E.164.
          example: "+576015550102"
    ProviderAvailabilityRequest:
      type: object
      additionalProperties: false
      required: [availability]
      properties:
        availability:
          type: string
          enum: [available, unavailable]
        unavailable_until:
          type: string
          format: date
          nullable: true
          description: Only with unavailable; today or later. Informative, it does not make the provider available on its own.
    Provider:
      type: object
      required: [id, name, specialties, latitude, longitude, address, contact_email, contact_phone, availability,
        unavailable_until, busy_claim_id, updated_by, updated_at]
      properties:
        id:
          type: string
          example: prv-servicios-hogar-norte
        name:
          type: string
        specialties:
          type: array
          items:
            $ref: "#/components/schemas/Specialty"
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
          nullable: true
        availability:
          $ref: "#/components/schemas/ProviderAvailability"
        unavailable_until:
          type: string
          format: date
          nullable: true
        busy_claim_id:
          type: string
          nullable: true
          description: The claim the provider is assigned to while busy.
        updated_by:
          type: string
          description: E-mail of the analyst who last changed it, or "reference-data" for the seed.
        updated_at:
          type: string
          format: date-time
    ProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Provider"
    QueueHolder:
      type: object
      required: [full_name, document_type, document_id]
      description: The insured of the claim, without their contact.
      properties:
        full_name:
          type: string
        document_type:
          type: string
        document_id:
          type: string
    PriorityQueueItem:
      allOf:
        - $ref: "#/components/schemas/EvaluationQueueItem"
        - type: object
          required: [holder]
          properties:
            holder:
              allOf:
                - $ref: "#/components/schemas/QueueHolder"
              nullable: true
              description: null when the policy core does not answer.
    PriorityQueue:
      type: object
      required: [items, next_page_token, summary]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PriorityQueueItem"
        next_page_token:
          type: string
          nullable: true
        summary:
          type: object
          required: [total, matching, levels, unassessed, mean_resolution_days, decided_in_window, window_days]
          properties:
            total:
              type: integer
              minimum: 0
              description: Claims in the queue, without the filters.
            matching:
              type: integer
              minimum: 0
              description: Claims that match the filters of the request.
            levels:
              type: array
              description: The claims of the queue of each level, 1 to 3, without the filters.
              items:
                type: object
                required: [level, claims]
                properties:
                  level:
                    $ref: "#/components/schemas/TriageLevel"
                  claims:
                    type: integer
                    minimum: 0
            unassessed:
              type: integer
              minimum: 0
              description: Claims of the queue the triage has not assessed yet.
            mean_resolution_days:
              type: number
              nullable: true
              description: Mean days from the filing to the decision, one decimal; null when none was decided in the window.
            decided_in_window:
              type: integer
              minimum: 0
            window_days:
              type: integer
              example: 30
