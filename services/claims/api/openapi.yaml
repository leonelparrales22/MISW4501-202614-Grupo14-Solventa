            type: string
            maxLength: 512
      responses:
        "200":
          description: One page of the payment exceptions
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationQueue"
        "400":
          description: "invalid_request - page_size out of 1 to 50 or a page token that is not valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "forbidden - the token is not of operations"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "claims_unavailable - retry"
          content:
            application/json:
              schema:
