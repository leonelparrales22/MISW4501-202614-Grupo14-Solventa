name: backend-ci
on:
  pull_request:
    paths: ["services/**", "pkg/**", "stubs/**", "go.work", ".golangci.yml", ".github/workflows/backend-ci.yml"]
  push:
    branches: [develop, main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: make build
      - run: make test
