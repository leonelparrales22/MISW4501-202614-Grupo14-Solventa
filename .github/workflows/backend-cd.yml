name: backend-cd
# Continuous delivery to staging.
#   push to develop: nothing runs.
#   Run workflow on develop (manual): build every image of the last commit of
#   develop, push them to ECR tagged with the commit SHA and deploy it to staging.
#   scripts/environment/up.sh staging takes these images, so run it before
#   turning staging on to start it with the last commit of develop.
#   merge to main (automatic): build every image of the merge commit, record its
#   tag in SSM (/solventa/production-demo/image-tag, read by
#   scripts/environment/up.sh production-demo) and deploy it to staging.
# The deploy is terraform apply of staging/platform with image_tag=<sha>. When
# staging is off it only warns: scripts/environment/up.sh staging turns it on.
on:
  # No path filter: every merge to main deploys.
  push:
    branches: [main]
  # develop (or main) on demand; any other branch is skipped.
  workflow_dispatch:

# Concurrency is set per job: deploys are serialized without holding back the
# publishing of the next commits.

permissions:
  contents: read

# Explicit bash runs with -eo pipefail (the default shell has no pipefail), so a
# failing script piped to tee fails its step.
defaults:
  run:
    shell: bash

env:
  AWS_REGION: us-east-2
  # Created by infra/terraform/bootstrap/cd-ecr.
  AWS_ROLE_ARN: arn:aws:iam::368083581678:role/solventa-github-actions-ecr
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::368083581678:role/solventa-github-actions-deploy-staging
  ECR_REGISTRY: 368083581678.dkr.ecr.us-east-2.amazonaws.com
  IMAGE_TAG_PARAMETER: /solventa/production-demo/image-tag
  # Name of staging/platform (main.tf).
  STAGING_CLUSTER: solventa-stg
  STAGING_DIR: infra/terraform/environments/staging/platform

jobs:
  plan:
    # Only develop and main may publish (the trust policy of the publish role).
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changed.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # An empty base builds every image (every run deploys), so the deployed
      # commit has all its tags and staging takes a single image_tag. Images
      # that already exist are not rebuilt (publish).
      - id: changed
        run: echo "images=$(scripts/ci/changed-images.sh "" "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    # Never cancel a publish in flight; queue the next one for the same branch.
    concurrency:
      group: backend-cd-publish-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token exchanged for short-lived AWS credentials
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Resolve the Dockerfile and tag
        id: meta
        run: |
          if [ -f "services/${{ matrix.image }}/Dockerfile" ]; then
            echo "dockerfile=services/${{ matrix.image }}/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=stubs/${{ matrix.image }}/Dockerfile" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # Tags are immutable in ECR: a re-run of the same commit must not try to overwrite.
      - name: Check whether the image already exists
        id: exists
        run: |
          if aws ecr describe-images --repository-name "solventa/${{ matrix.image }}" \
              --image-ids "imageTag=${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          # One plain manifest per tag: buildx's provenance attestation adds untagged
          # child manifests that the ECR lifecycle policy (expire untagged) could delete.
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/solventa/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Summary
        run: |
          echo "- \`solventa/${{ matrix.image }}:${{ steps.meta.outputs.tag }}\` (already existed: ${{ steps.exists.outputs.found }})" >> "$GITHUB_STEP_SUMMARY"

  # main only, once every image of the commit is in ECR: up.sh production-demo
  # turns the demo on with this tag.
  release:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialized so an older run never overwrites the tag of a newer one.
    concurrency:
      group: backend-cd-release-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Record the release tag
        run: |
          tag="${GITHUB_SHA::12}"
          aws ssm put-parameter --name "$IMAGE_TAG_PARAMETER" --value "$tag" --overwrite >/dev/null
          echo "Release tag \`$tag\` recorded in \`$IMAGE_TAG_PARAMETER\`." >> "$GITHUB_STEP_SUMMARY"

  # Automatic on a merge to main; manual (Run workflow) on develop or main.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    # No reviewers: the environment records the deployments and is the only
    # identity the deploy role trusts.
    environment: staging
    # One deploy at a time; a newer pending deploy replaces an older pending one.
    concurrency:
      group: backend-cd-deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      # staging is off most of the time (cost). Off (no cluster, or a service at
      # 0 tasks while up.sh prepares the database or a window takes a stub down),
      # nothing is applied: an apply would create or change the whole environment.
      - name: Check whether staging is up
        id: status
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          state=$(scripts/ci/environment-status.sh "$STAGING_CLUSTER")
          echo "up=$([ "$state" = "up" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$state" != "up" ]; then
            echo "::notice::staging is ${state}. Images published, nothing deployed; scripts/environment/up.sh staging turns it on."
            echo "staging is ${state}. Images published, nothing deployed; \`scripts/environment/up.sh staging\` turns it on." >> "$GITHUB_STEP_SUMMARY"
          fi
      # ttl and extra_tags become tags of every resource: reuse the ones up.sh
      # applied, so the plan only changes the images.
      - name: Read the variables of the running environment
        if: steps.status.outputs.up == 'true'
        run: scripts/ci/staging-vars.sh "$STAGING_CLUSTER" > "$RUNNER_TEMP/staging.tfvars.json"
      - name: Terraform plan
        if: steps.status.outputs.up == 'true'
        working-directory: ${{ env.STAGING_DIR }}
        run: |
          terraform init -input=false
          terraform plan -input=false -lock-timeout=5m -var-file="$RUNNER_TEMP/staging.tfvars.json" -var "image_tag=$IMAGE_TAG" -out=tfplan
      - name: Check that the plan only changes ECS
        if: steps.status.outputs.up == 'true'
        working-directory: ${{ env.STAGING_DIR }}
        run: |
          terraform show -json tfplan | "$GITHUB_WORKSPACE/scripts/ci/check-deploy-plan.sh" | tee plan-check.txt
          { echo "### Plan of \`$IMAGE_TAG\` ($GITHUB_REF_NAME)"; echo '```'; cat plan-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Terraform apply
        if: steps.status.outputs.up == 'true'
        working-directory: ${{ env.STAGING_DIR }}
        run: terraform apply -input=false -lock-timeout=5m tfplan
      - name: Verify the services
        if: steps.status.outputs.up == 'true'
        run: |
          scripts/ci/verify-ecs-deploy.sh "$STAGING_CLUSTER" "$IMAGE_TAG" | tee verify.txt
          { echo "### Services"; echo '```'; cat verify.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
