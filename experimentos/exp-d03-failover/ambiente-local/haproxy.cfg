global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlog-normal
    option log-health-checks
    option http-keep-alive
    retries 3
    timeout connect 2s
    timeout client 30s
    timeout server 10s
    timeout check "${HC_TIMEOUT}"

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend entrada
    bind *:80
    default_backend originacion

backend originacion
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter "${HC_INTER}" fall "${HC_FALL}" rise "${HC_RISE}" resolvers docker init-addr libc,none
    server a stub-a:8080 check
    server b stub-b:8080 check
